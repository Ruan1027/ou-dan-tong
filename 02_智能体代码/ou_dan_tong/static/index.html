<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>瓯单通 · 订单协同智能体</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f4f6fb; --card:#fff; --brand:#2563eb; --brand2:#1e40af;
          --ok:#16a34a; --warn:#dc2626; --muted:#64748b; --line:#e5e7eb;
          --wx-bg:#ededed; --wx-in:#ffffff; --wx-out:#95ec69; --wx-head:#ededed; }
  body { font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background: var(--bg); color:#0f172a; height:100vh; display:flex; flex-direction:column; }
  /* —— 顶栏 + 分页签 —— */
  header { background: linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff;
           padding:0 18px; display:flex; align-items:center; gap:14px; height:58px; flex-shrink:0; }
  header .logo { font-size:20px; font-weight:800; letter-spacing:1px; }
  header .tag { font-size:12px; opacity:.9; }
  .tabs { display:flex; gap:8px; margin-left:18px; }
  .tab-btn { background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:999px;
             padding:6px 16px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .tab-btn.active { background:#fff; color:var(--brand2); }
  header .mode { margin-left:auto; font-size:12px; background:rgba(255,255,255,.18);
                padding:4px 10px; border-radius:999px; }
  /* 口语化开关（模块四 C-1）：默认关＝模板直出，勾上＝允许 LLM 改写 */
  header .colloqui { display:flex; align-items:center; gap:6px; font-size:12px;
                     background:rgba(255,255,255,.18); padding:4px 10px; border-radius:999px;
                     cursor:pointer; user-select:none; }
  header .colloqui input { margin:0; cursor:pointer; }
  main { flex:1; overflow:hidden; padding:14px; }
  .tab { display:none; height:100%; }
  .tab.active { display:flex; gap:14px; }

  /* ========== Tab1 · 微信沟通模拟 ========== */
  .wechat { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--wx-bg);
            border-radius:14px; overflow:hidden; border:1px solid var(--line); }
  .wx-head { background:var(--wx-head); padding:10px 14px; font-size:14px; font-weight:600;
             color:#1f2937; border-bottom:1px solid #e0e0e0; display:flex; align-items:center; gap:8px; }
  .wx-head .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); }
  .wx-note { background:#fffbeb; color:#92600a; font-size:12px; padding:6px 14px; border-bottom:1px solid #fde68a; }
  /* scrollbar-gutter:stable —— 滚动条常驻占位，消息增减不再改变内容可用宽度 */
  .wx-chat { flex:1; overflow-y:auto; scrollbar-gutter:stable; padding:16px 14px; }
  .row { display:flex; gap:8px; margin-bottom:14px; align-items:flex-start; }
  .row.customer { flex-direction:row; }
  .row.agent { flex-direction:row-reverse; }
  .avatar { width:38px; height:38px; border-radius:6px; flex-shrink:0; display:flex;
            align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#fff; }
  .avatar.cust { background:#94a3b8; }
  .avatar.agent { background:var(--brand); }
  /* 消息列：宽度约束放列上，气泡本身自适应内容；保证气泡边缘始终贴头像 */
  .col { display:flex; flex-direction:column; max-width:74%; min-width:0; }
  .row.customer .col { align-items:flex-start; }
  .row.agent .col { align-items:flex-end; }
  .bubble { max-width:100%; padding:9px 12px; border-radius:8px; line-height:1.55; font-size:14px;
            white-space:pre-wrap; word-break:break-word; position:relative; }
  .row.customer .bubble { background:var(--wx-in); color:#111; border-top-left-radius:2px; }
  .row.agent .bubble { background:var(--wx-out); color:#111; border-top-right-radius:2px; }
  .cap { font-size:11px; color:var(--muted); margin-bottom:3px; }
  .row.customer .cap { text-align:left; }
  .row.agent .cap { text-align:right; }
  .wx-actions { display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px; background:var(--wx-head);
                border-top:1px solid #e0e0e0; }
  .wx-actions .lbl { width:100%; font-size:11.5px; color:var(--muted); }
  .cbtn { border:1px solid #cbd5e1; background:#fff; color:#0f172a; border-radius:10px;
          padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  .cbtn:hover { background:#f1f5f9; }
  .wx-input { display:flex; gap:8px; padding:10px 14px; background:#f7f7f7; border-top:1px solid #e0e0e0; }
  /* 发言人输入框：平台直接面向顾客，发信人即客户本人，必须随消息一起传下去 */
  .wx-input .wx-sender { width:80px; flex:0 0 auto; height:42px; border:1px solid var(--line);
                         border-radius:10px; padding:0 10px; font-size:13px; font-family:inherit;
                         text-align:center; color:var(--brand2); font-weight:600; }
  .wx-input textarea { flex:1; resize:none; height:42px; border:1px solid var(--line); border-radius:10px;
                       padding:9px 12px; font-size:14px; font-family:inherit; }
  .wx-input button { border:none; border-radius:10px; padding:0 18px; font-weight:600; cursor:pointer;
                     background:var(--brand); color:#fff; flex:0 0 auto; }

  /* ========== 通用：表格 / 状态徽章 ========== */
  /* 注意：.panel / .panel h3 的实际定义在下方「Tab2」段落，此处不要再定义一份，
     否则旧的 overflow:hidden 会残留并继续裁剪面板内容（本页曾因此踩坑）。 */
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; white-space:nowrap; }
  .b-沟通中{background:#fef9c3;color:#854d0e;} .b-已报价{background:#dbeafe;color:#1e40af;}
  .b-已确认{background:#ede9fe;color:#5b21b6;} .b-生产中{background:#dcfce7;color:#166534;}
  .b-已交付{background:#e2e8f0;color:#475569;} .b-部分交付{background:#ffedd5;color:#9a3412;}
  .b-待补充{background:#fee2e2;color:#b91c1c;} .b-已取消{background:#f1f5f9;color:#64748b;}
  .b-追加{background:#ffedd5;color:#9a3412;}
  .empty { color:var(--muted); font-size:12.5px; }

  /* ========== Tab2 · 平台汇总 ========== */
  /* 布局：固定视口高度 + 三行结构，每块内部独立滚动。
     这样任何一块数据变多都只在自身内部滚，绝不压缩/顶飞其他块
     （旧版用整页 overflow-y:auto + 面板 overflow:hidden，订单变多后
       把查询输入框和按钮裁掉，表现就是"按钮点了没反应"）。 */
  #tab-platform { display:flex; flex-direction:column; gap:12px; height:100%; overflow:hidden; }
  .p-row { display:flex; gap:12px; min-height:0; }
  .p-row-top  { flex:0 0 auto; }
  .p-row-main { flex:1 1 auto; min-height:0; }
  .p-row-foot { flex:0 0 auto; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  @supports not (scrollbar-gutter: stable) {
    .wx-chat { overflow-y:scroll; }
  }

  /* 统计卡：5 等分自适应，不再写死 118px */
  .stats { flex:0 0 auto; display:grid; grid-template-columns:repeat(5, minmax(88px, 1fr));
           gap:10px; min-width:0; max-width:680px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:12px 6px; text-align:center; min-width:0; }
  .stat .n { font-size:22px; font-weight:800; color:var(--brand2); line-height:1.2; }
  .stat .t { font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis; }

  /* 面板：纵向容器，标题固定、内容区独立滚动 —— 不挤压的关键 */
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px;
           padding:12px 14px; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .panel h3 { font-size:14px; margin-bottom:8px; color:var(--brand2); flex:0 0 auto;
              display:flex; align-items:baseline; gap:6px; white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }
  .panel h3 small { color:var(--muted); font-weight:400; font-size:11.5px; }
  .panel-body { flex:1 1 auto; min-height:0; overflow:auto; scrollbar-gutter:stable; margin-top:6px; }

  /* 第一行：统计卡 + 订单查询（查询常驻右上，不用往下滚） */
  .panel-query { flex:1 1 auto; }
  .p-row-top .query-box { flex:0 0 auto; }

  /* 第二行：订单台账 / 任务台账 / 今日简报，比例固定 */
  .p-order { flex:0 0 calc(50% - 8px); }
  .p-task  { flex:0 0 calc(22% - 8px); }
  .p-brief { flex:1 1 auto; }
  .p-brief .brief-btn { flex:0 0 auto; margin-bottom:8px; }

  /* 台账表：固定列宽 + 表头吸顶（基础 table 样式见上「通用」段，此处不再重复定义） */
  #pOrderTable table, #pTaskTable table { table-layout:fixed; }
  #pOrderTable th:nth-child(1){width:19%} #pOrderTable th:nth-child(2){width:17%}
  #pOrderTable th:nth-child(3){width:19%} #pOrderTable th:nth-child(4){width:9%}
  #pOrderTable th:nth-child(5){width:16%} #pOrderTable th:nth-child(6){width:20%}
  #pTaskTable th:nth-child(1){width:40%} #pTaskTable th:nth-child(2){width:18%}
  #pTaskTable th:nth-child(3){width:22%} #pTaskTable th:nth-child(4){width:20%}
  #pOrderTable table tr:first-child th,
  #pTaskTable table tr:first-child th {
    position:sticky; top:0; z-index:1; background:var(--card);
    box-shadow:inset 0 -1px 0 var(--line); }
  td { overflow-wrap:anywhere; }

  /* 空状态：告诉用户这块是干什么用的、怎么才会有数据 */
  .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center;
                 text-align:center; padding:16px 8px; gap:6px; }
  .empty-state .es-icon { font-size:26px; opacity:.7; }
  .empty-state .es-title { font-size:13px; font-weight:600; color:#475569; }
  .empty-state .es-desc { font-size:12px; line-height:1.6; color:var(--muted); max-width:270px; }
  .empty-state .es-eg { font-size:11.5px; color:#94a3b8; background:#f8fafc;
                        border:1px dashed var(--line); border-radius:8px; padding:6px 10px;
                        margin-top:2px; max-width:270px; line-height:1.5; }

  .query-box { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .query-box input { flex:1 1 160px; min-width:0; height:38px; border:1px solid var(--line);
                     border-radius:9px; padding:0 12px; font-size:13.5px; font-family:inherit; }
  .query-box button { border:none; border-radius:9px; padding:0 18px; height:38px; font-weight:600;
                      cursor:pointer; background:var(--brand); color:#fff; flex:0 0 auto; }
  .query-box button:hover { background:var(--brand2); }
  .qchips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; flex:0 0 auto; }
  .qchip { background:#e0e7ff; color:var(--brand2); border:1px solid #c7d2fe; border-radius:999px;
           padding:4px 11px; font-size:12px; cursor:pointer; }
  .qchip:hover { background:#c7d2fe; }
  .result { background:#f8fafc; border:1px dashed var(--line); border-radius:8px;
            padding:10px 12px; font-size:13px; line-height:1.6; white-space:pre-wrap;
            min-height:40px; color:#1f2937; overflow-wrap:anywhere; }
  /* —— 查询反馈：命中即跳台账定位，这里只在「没法用高亮表达」时浮一行提示 —— */
  .q-note { display:none; margin-top:8px; font-size:12.5px; line-height:1.6; color:#1f2937;
            white-space:pre-wrap; overflow-wrap:anywhere; max-height:104px; overflow:auto;
            background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .q-note.show { display:block; }
  .q-note.info { background:#eff6ff; border-color:#dbeafe; color:var(--brand2); }
  .q-note.warn { background:#fef2f2; border-color:#fecaca; color:#b91c1c; }

  /* —— 定位高亮：命中行浅蓝底色 + 左侧品牌色竖线，一眼找到是哪一笔 —— */
  #pOrderTable tr.orow > td { transition:background .25s ease; }
  #pOrderTable tr.hit > td { background:#dbeafe; }
  #pOrderTable tr.hit > td:first-child { box-shadow:inset 3px 0 0 var(--brand); }
  #pOrderTable tr.hit.flash > td { animation:hitFlash .9s ease-out both; }
  @keyframes hitFlash { 0%{background:#93c5fd;} 55%{background:#c7e0fd;} 100%{background:#dbeafe;} }

  /* —— 变更履历：父单行里的小箭头入口 —— */
  .hist-toggle { display:inline-flex; align-items:center; gap:3px; margin-top:4px; font-family:inherit;
                 font-size:11px; line-height:1.4; color:var(--brand); background:#eff6ff;
                 border:1px solid #dbeafe; border-radius:999px; padding:1px 8px 1px 5px;
                 cursor:pointer; white-space:nowrap; }
  .hist-toggle:hover { background:#dbeafe; }
  .hist-toggle .arw { font-size:9px; transition:transform .15s ease; }
  .hist-toggle.open { background:#dbeafe; color:var(--brand2); }
  /* —— 变更履历子单行（son）：挂在父单下方，缩进 + 竖向引导线与父单连成树 —— */
  #pOrderTable tr.hist-row > td { padding:0 0 0 24px; background:#f8fbff;
                                  border-bottom:1px solid var(--line); }
  #pOrderTable tr.hist-row.hidden { display:none; }
  .hist-list { display:flex; flex-direction:column; gap:6px; margin:7px 0 8px 2px;
               padding-left:11px; border-left:2px solid #bfdbfe; }
  .hist-item { font-size:12px; line-height:1.5; color:#334155; }
  .hist-item .hi-top { display:flex; flex-wrap:wrap; align-items:baseline; gap:0 5px; }
  .hist-item .hi-idx { color:#94a3b8; font-weight:700; }
  .hist-item .hi-newest { font-size:10px; font-weight:700; color:#fff; background:#93c5fd;
                          border-radius:999px; padding:0 6px; }
  .hist-item .hi-field { color:var(--brand2); font-weight:700; }
  .hist-item .hi-old { color:#94a3b8; text-decoration:line-through; }
  .hist-item .hi-arr { color:#94a3b8; }
  .hist-item .hi-nw { color:#166534; font-weight:700; }
  .hist-item .hi-time { color:#94a3b8; margin-left:auto; white-space:nowrap; font-size:11px; }
  .hist-item .hi-src { color:var(--muted); font-size:11.5px; }
  .hist-empty { font-size:11.5px; color:var(--muted); padding:7px 0; }

  /* —— 轻提示：定位/展开这类一句话反馈，2.8s 自动消失，不占版面 —— */
  #toast { position:fixed; left:50%; bottom:58px; transform:translateX(-50%) translateY(8px);
           max-width:min(600px,88vw); background:rgba(15,23,42,.93); color:#fff; font-size:13px;
           line-height:1.5; padding:9px 16px; border-radius:10px; z-index:98;
           box-shadow:0 6px 22px rgba(0,0,0,.2); opacity:0; pointer-events:none;
           transition:opacity .2s ease, transform .2s ease; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast .tk { color:#93c5fd; font-weight:700; }
  #toast .t-warn { color:#fca5a5; }
  .query-box button:disabled { background:#94a3b8; cursor:progress; }

  .brief-btn { border:none; border-radius:9px; padding:9px 16px; font-weight:700; cursor:pointer;
               background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; font-size:13.5px; }
  .brief-btn:hover { filter:brightness(.94); }
  .reset-link { background:#fee2e2; color:var(--warn); border:none; border-radius:9px;
                padding:8px 14px; font-weight:600; cursor:pointer; font-size:13px; }
  .reset-link:hover { background:#fecaca; }
  .foot-hint { font-size:11.5px; color:var(--muted); }

  /* 响应式：窄屏改为整页纵向滚动，各块给最大高度，仍不互相挤压 */
  @media (max-width: 1180px) {
    #tab-platform { overflow-y:auto; scrollbar-gutter:stable; }
    .p-row-top, .p-row-main { flex-direction:column; }
    .stats { grid-template-columns:repeat(auto-fit, minmax(88px, 1fr)); max-width:none; }
    .p-order, .p-task, .p-brief, .panel-query { flex:0 0 auto; }
    .p-row-main .panel { max-height:320px; }
  }
  @media (max-width: 720px) {
    .stats { grid-template-columns:repeat(2, 1fr); }
    .query-box input { flex:1 1 100%; }
    .query-box button { flex:1 1 100%; }
    main { padding:10px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">瓯单通</div>
  </div>
  <div class="tag">温州中小企业 · 订单协同智能体</div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('chat')">💬 微信沟通</button>
    <button class="tab-btn" onclick="switchTab('platform')">📊 平台汇总</button>
  </div>
  <div class="mode" id="modeBadge">加载中…</div>
  <label class="colloqui" title="开启后查询/简报会经大模型改写成口语播报体（C-1）。默认关闭＝模板直出，更快、话术与判定一一对应。">
    <input type="checkbox" id="colloquialToggle" /> 口语化
  </label>
</header>

<main>
  <!-- ===== Tab1：微信沟通模拟 ===== -->
  <section class="tab active" id="tab-chat">
    <div class="wechat">
      <div class="wx-head"><span class="dot"></span>瓯单通 · 订单协作群（演示）</div>
      <div class="wx-note">本页还原微信沟通场景：左侧「客户」发来的消息，右侧「瓯单通」自动提取并写入台账（台账可在「📊 平台汇总」页查看）。</div>
      <div class="wx-chat" id="wxChat"></div>
      <div class="wx-actions" id="wxActions">
        <span class="lbl">▸ 模拟客户发来以下消息（点击即发给瓯单通）：</span>
      </div>
      <div class="wx-input">
        <input id="wxSender" class="wx-sender" value="王总" title="这条消息是谁发的。平台直接面向顾客，发信人即客户本人。"
               placeholder="发言人" />
        <textarea id="wxInput" placeholder="以客户身份输入消息，如：小陈，法兰那批再给我加 200 个"></textarea>
        <button type="button" onclick="wxSendInput()">发送</button>
      </div>
    </div>

  </section>

  <!-- ===== Tab2：平台汇总 / 查询 ===== -->
  <section class="tab" id="tab-platform">
    <!-- 第一行：统计卡 + 订单查询（查询常驻右上，不必往下滚） -->
    <div class="p-row p-row-top">
      <div class="stats" id="stats"></div>
      <div class="panel panel-query">
        <h3>🔍 订单查询 <small>问「XX 那单到哪了」· 命中直接跳到台账定位</small></h3>
        <div class="query-box">
          <input id="qInput" placeholder="如：法兰那单到哪了？ / 法兰那单改过几次" />
          <button type="button" onclick="doQuery()">查询</button>
        </div>
        <div class="qchips">
          <span class="qchip" onclick="qExample('法兰那单到哪了？')">查法兰那单</span>
          <span class="qchip" onclick="qExample('DZ47 到哪了')">查 DZ47</span>
          <span class="qchip" onclick="qExample('王总那单到哪了')">查王总那单</span>
          <span class="qchip" onclick="qExample('法兰那单改过几次')">查变更履历</span>
        </div>
        <!-- 命中结果不再在这里显示：结果体现为台账里那一行被跳转 + 浅蓝高亮。
             只有多单待澄清 / 无命中 / 文本类回答时，才在下浮一行提示。 -->
        <div class="q-note" id="qNote"></div>
      </div>
    </div>

    <!-- 第二行：订单台账 / 任务台账 / 今日简报 —— 各自固定高度、内部滚动 -->
    <div class="p-row p-row-main">
      <div class="panel p-order">
        <h3>📦 订单台账 <small id="pOrderCount"></small></h3>
        <div class="panel-body" id="pOrderTable"></div>
      </div>
      <div class="panel p-task">
        <h3>✅ 任务台账 <small id="pTaskCount"></small></h3>
        <div class="panel-body" id="pTaskTable"></div>
      </div>
      <div class="panel p-brief">
        <h3>📊 今日简报 <small>新增 / 待跟进 / 临期</small></h3>
        <button type="button" class="brief-btn" onclick="doBriefing()">📊 出今日简报</button>
        <div class="panel-body"><div class="result" id="briefResult">点击上方按钮生成今日简报。</div></div>
      </div>
    </div>

    <!-- 第三行：底部操作 -->
    <div class="p-row p-row-foot">
      <span class="foot-hint">台账实时写入本地 JSON；重置后恢复演示种子单（5 单 · 多状态）。</span>

</main>

<div id="errBanner" style="display:none;position:fixed;left:0;right:0;bottom:0;background:#dc2626;color:#fff;padding:10px 16px;font-size:13px;z-index:99;box-shadow:0 -2px 8px rgba(0,0,0,.2);"></div>

<script>
/* sender = 微信群里的发言人昵称。真实微信群每条消息都带它，必须一并传给智能体：
   否则「小陈，DZ47 那个加到 80 个」这类客户自报消息会因为正文没写客户名
   被抽成 customer=null，整条被当作「信息不全」丢弃。 */
const CHAT_SCENARIOS = [
  { label:"🆕 客户新建订单", scenario:"new", sender:"阿珍",
    text:"老周，秋季那款运动鞋鞋底 EVA 发泡的，先给我 800 双，最好 11 月 10 号前到，客户催得紧" },
  { label:"✏️ 客户改数量", scenario:"update", sender:"李姐",
    text:"小陈，DZ47 那个加到 80 个" },
  { label:"📥 客户追加订单", scenario:"append", sender:"王总",
    text:"小陈，法兰那批再给我加 200 个，跟上次一起发" },
  { label:"🟡 客户信息缺失", scenario:"missing", sender:"王总",
    text:"小陈，法兰那批的货再帮我排上一批，我这边急" },
  { label:"⚠️ 客户数据冲突", scenario:"conflict", sender:"王总",
    text:"小陈，法兰 DN80 那单单价你按 18 算，上次说好的" },
  { label:"⛔ 客户异常拦截", scenario:"abnormal", sender:"李姐",
    text:"小陈，DZ47 那个数量给我改成 -300" },
];
const SIM_NOTE = "⚠️ 模拟模式";

function el(id){ return document.getElementById(id); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function stripNote(t){ const i=(t||"").indexOf("\n\n"+SIM_NOTE); return (i>=0?t.slice(0,i):t).trim(); }
function modeCap(m){ return ({parse:"📦 提取入库", query:"🔍 订单查询", briefing:"📊 今日简报", hint:"💡 提示"})[m]||""; }

/* 错误横幅：任何未捕获异常/网络失败都可见，避免静默空白 */
function showErr(m){ const b=el("errBanner"); if(!b) return; b.style.display="block"; b.textContent="⚠️ "+m; }
window.addEventListener("error", function(e){ showErr("页面脚本异常："+(e.message||(e.error&&e.error.message)||"未知错误")); });

/* 统一接口封装：带错误处理，失败抛错由调用方决定提示方式 */
async function apiGet(path){
  const r = await fetch(path, {headers:{"Accept":"application/json"}});
  if(!r.ok) throw new Error("HTTP "+r.status+" "+path);
  return await r.json();
}
async function apiPost(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
    body: body?JSON.stringify(body):"{}"});
  if(!r.ok) throw new Error("HTTP "+r.status+" "+path);
  return await r.json();
}

/* 会话 id（模块四 C-2）：多轮指代消解靠它隔离上下文。
   同一浏览器保持同一个 id，换个标签页/换个人演示就是另一份上下文，不会串话。 */
const SID = (function(){
  try{
    let v = localStorage.getItem("ou_sid");
    if(!v){ v = "s" + Math.random().toString(36).slice(2,10); localStorage.setItem("ou_sid", v); }
    return v;
  }catch(e){ return "default"; }   /* 隐私模式禁用 localStorage 时退化为单会话 */
})();

/* 统一的对话请求：自动带上会话 id 与「口语化」开关，避免各调用点漏传。
   漏传的两个后果都很难查：上下文串到别人那、口语化按钮点了没反应。 */
function chatPost(body){
  const t = el("colloquialToggle");
  return apiPost("/api/chat", Object.assign({}, body, {
    sid: SID,
    colloquial: !!(t && t.checked)
  }));
}

function switchTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  el("tab-"+name).classList.add("active");
  Array.from(document.querySelectorAll(".tab-btn")).forEach(b=>{
    if(b.textContent.includes(name==="chat"?"微信":"平台")) b.classList.add("active");
  });
  /* 每次进入平台页都重新拉取，保证数据最新、且能从初始加载失败中恢复 */
  if(name==="platform") refreshPlatform();
}

/* ---------- 微信气泡 ---------- */
function addWx(role, text, mode, sender){
  const wrap = document.createElement("div");
  wrap.className = "row " + (role==="customer"?"customer":"agent");
  const av = document.createElement("div");
  av.className = "avatar " + (role==="customer"?"cust":"agent");
  av.textContent = role==="customer" ? (sender ? sender.slice(0,1) : "客") : "瓯";
  const col = document.createElement("div"); col.className = "col";
  if(role==="agent"){
    const cap = document.createElement("div"); cap.className="cap"; cap.textContent = modeCap(mode);
    col.appendChild(cap);
  } else if(sender){
    /* 显示发言人昵称：还原微信群真实形态，也让人一眼看到「客户身份」从哪来 */
    const cap = document.createElement("div"); cap.className="cap"; cap.textContent = sender;
    col.appendChild(cap);
  }
  const b = document.createElement("div"); b.className="bubble"; b.textContent = text;
  col.appendChild(b);
  wrap.appendChild(av); wrap.appendChild(col);
  el("wxChat").appendChild(wrap);
  el("wxChat").scrollTop = el("wxChat").scrollHeight;
}

/* 等待占位气泡：网关单次响应 18~50s，没有反馈用户会以为卡死 */
function addWxPending(){
  const wrap = document.createElement("div");
  wrap.className = "row agent";
  const av = document.createElement("div"); av.className = "avatar agent"; av.textContent = "瓯";
  const col = document.createElement("div"); col.className = "col";
  const cap = document.createElement("div"); cap.className="cap"; cap.textContent = "⏳ 解析中";
  const b = document.createElement("div"); b.className="bubble";
  const t0 = Date.now();
  b.textContent = "正在提取订单要素…";
  const timer = setInterval(()=>{
    b.textContent = `正在提取订单要素… 已等待 ${Math.round((Date.now()-t0)/1000)}s`;
  }, 1000);
  col.appendChild(cap); col.appendChild(b);
  wrap.appendChild(av); wrap.appendChild(col);
  el("wxChat").appendChild(wrap);
  el("wxChat").scrollTop = el("wxChat").scrollHeight;
  return { remove(){ clearInterval(timer); wrap.remove(); } };
}

async function wxSend(text, scenario, sender){
  if(!text) return;
  addWx("customer", text, null, sender);
  const pending = addWxPending();
  try{
    const data = await chatPost({message:text, scenario: scenario||null, sender: sender||null});
    pending.remove();
    addWx("agent", stripNote(data.reply||"（无回复）"), data.mode);
    if(data.ledger) renderPlatform(data.ledger);
  }catch(e){
    pending.remove();
    showErr("发送失败："+e.message); addWx("agent","（网络异常，未能连接智能体）","hint");
  }
}
function wxSendInput(){
  const i = el("wxInput"); if(!i) return;
  const t = i.value.trim();
  if(!t){ i.focus(); return; }
  /* 手动输入也必须带上发言人：缺了它，后端只能判「缺少客户信息」，
     而本平台面向顾客，发信人本来就是客户本人。 */
  const sEl = el("wxSender");
  const s = (sEl && sEl.value.trim()) || "客户";
  wxSend(t, null, s);
  i.value = "";
}
async function wxSendScenario(s){ await wxSend(s.text, s.scenario, s.sender); }

/* ---------- 台账渲染 ---------- */
/* 变更履历（changes[] / change_log）在台账里以「子单」形式展开：
   父单行内给一个小箭头入口，点开后紧跟一行 colspan 子行，逐条列出改动。
   展开状态记在 histOpen 里，重渲染（刷新台账 / 再查询）后保持不塌。 */
const FIELD_LABEL = { qty:"数量", unit_price:"单价", delivery_date:"交期", status:"状态",
                      spec:"规格", sample_flag:"样品", customer:"客户", product:"产品",
                      delivered_qty:"已交数量", remain_qty:"余量" };
const histOpen = new Set();     /* 已展开变更履历的单号 */
let HIT_IDS = [];               /* 当前被定位高亮的单号 */
let LAST_LEDGER = null;         /* 最近一次台账快照：展开/收起时局部重渲染用 */

function orderHist(o){
  const h = o && (o.change_log || o.changes);
  return Array.isArray(h) ? h : [];
}
function fieldLabel(f){ return FIELD_LABEL[f] || f || "变更"; }
/* 一条 change 可能压了多个字段（field="qty,status"，old/new 用 " | " 拼），
   拆成「字段：旧 → 新」多条，避免子单里出现看不懂的逗号串。 */
function histParts(c){
  const fields = String(c.field == null ? "" : c.field).split(",").map(s=>s.trim()).filter(Boolean);
  const olds = String(c.old == null ? "—" : c.old).split(" | ");
  const news = String(c.new == null ? "—" : c.new).split(" | ");
  if(fields.length && fields.length === olds.length && fields.length === news.length){
    return fields.map((f,i)=>({ f:f, o:olds[i], n:news[i] }));
  }
  return [{ f: fields.join("/") || "变更",
            o: String(c.old == null ? "—" : c.old),
            n: String(c.new == null ? "—" : c.new) }];
}
function histHtml(hist){
  if(!hist.length) return `<div class="hist-empty">本单无变更记录（建单后未修改）。</div>`;
  /* 倒序：最新一条在最上面，与「查变更履历」的文字答案口径一致 */
  const items = hist.map((c,i)=>({ c:c, no:i+1 })).reverse();
  return `<div class="hist-list">` + items.map((it, i)=>{
    const c = it.c;
    const time = (c.time || "").replace("T"," ").slice(5,16);        /* MM-DD HH:MM */
    const who = c.speaker || "";
    const src = String(c.raw || c.source || "").trim();
    const parts = histParts(c).map(p=>
      `<span class="hi-field">${esc(fieldLabel(p.f))}</span>`+
      `<span class="hi-old">${esc(p.o)}</span>`+
      `<span class="hi-arr">→</span>`+
      `<span class="hi-nw">${esc(p.n)}</span>`).join("");
    return `<div class="hist-item">
      <div class="hi-top">
        ${hist.length > 1 ? `<span class="hi-idx">#${it.no}</span>` : ""}${i === 0 ? `<span class="hi-newest">最新</span>` : ""}
        ${parts}
        <span class="hi-time">${esc(time)}${who ? " · " + esc(who) : ""}</span>
      </div>
      ${src ? `<div class="hi-src">📎 ${esc(src)}</div>` : ""}
    </div>`;
  }).join("") + `</div>`;
}

function orderRows(orders){
  /* 追加单必须一眼可辨：单号后打「追加」徽章，并在交期下注明追加自哪一单 */
  return orders.map(o=>{
    const oid = o.order_id || "";
    const tag = o.is_append ? ' <span class="badge b-追加">追加</span>' : '';
    const from = o.is_append && o.parent_order_id ? `<div class="cap">追加自 ${esc(o.parent_order_id)}</div>` : '';
    const hist = orderHist(o);
    const open = histOpen.has(oid);
    /* 有履历才给入口；没有就不放空箭头，避免点开一片空 */
    const histBtn = hist.length ? `<button type="button" class="hist-toggle${open ? " open" : ""}"`+
      ` data-oid="${esc(oid)}" aria-expanded="${open ? "true" : "false"}"`+
      ` title="展开 / 收起本单变更履历"><span class="arw">${open ? "▾" : "▸"}</span>变更履历 ${hist.length}</button>` : '';
    const row = `<tr class="orow" data-oid="${esc(oid)}"><td>${esc(oid)}${tag}${histBtn}</td>`+
      `<td>${esc(o.customer)}</td>`+
      `<td>${esc(o.product)}</td><td>${esc(o.qty)}</td><td>${esc(o.delivery_date||"—")}${from}</td>`+
      `<td><span class="badge b-${esc(o.status)}">${esc(o.status)}</span></td></tr>`;
    const child = hist.length ? `<tr class="hist-row${open ? "" : " hidden"}" data-for="${esc(oid)}">`+
      `<td colspan="6">${histHtml(hist)}</td></tr>` : '';
    return row + child;
  }).join("");
}
function taskRows(tasks){
  return tasks.map(t=>`<tr><td>${esc(t.content)}</td><td>${esc(t.owner||"待认领")}</td>`+
    `<td>${esc(t.deadline||"待定")}</td><td>${esc(t.status)}</td></tr>`).join("");
}
/* 空状态：不只是说「暂无」，要讲清这块是干什么的、怎么才会有数据。
   任务台账没任务时尤其需要 —— 否则一张「0 项」的空卡看不出任何效用。 */
function emptyState(icon, title, desc, eg){
  return `<div class="empty-state">
    <div class="es-icon">${icon}</div>
    <div class="es-title">${title}</div>
    <div class="es-desc">${desc}</div>
    ${eg ? `<div class="es-eg">例：${eg}</div>` : ""}
  </div>`;
}

function renderOrderTable(orders){
  const box = el("pOrderTable"); if(!box) return;
  orders = orders || (LAST_LEDGER && LAST_LEDGER.orders) || [];
  box.innerHTML = orders.length ? (
    "<table><tr><th>单号</th><th>客户</th><th>产品</th><th>数量</th><th>交期</th><th>状态</th></tr>"+
    orderRows(orders)+"</table>") : emptyState("📭", "台账还没有订单",
      "客户在「💬 微信沟通」页发来订单消息后，这里会自动生成订单行并持续跟踪变更。",
      "「小陈，法兰 DN80 250 个，28 号前要」");
  applyHit(false);   /* 重渲染后把当前定位高亮补回去，避免刷新就把人看丢了 */
}

/* 高亮：给 HIT_IDS 里的单加上浅蓝底色；scroll=true 时把它滚到可视区中间 */
function applyHit(scroll){
  const box = el("pOrderTable"); if(!box) return;
  box.querySelectorAll("tr.hit").forEach(tr=>tr.classList.remove("hit","flash"));
  void box.offsetHeight;                       /* 强制重排：否则同一帧里重加 flash 动画不重播 */
  let first = null;
  HIT_IDS.forEach(oid=>{
    const tr = box.querySelector(`tr.orow[data-oid="${esc(oid)}"]`);
    if(!tr) return;
    tr.classList.add("hit");
    if(scroll) tr.classList.add("flash");
    if(!first) first = tr;
  });
  if(first && scroll){
    /* 台账在面板内部滚动，scrollIntoView 会连同外层一起调整到居中位置 */
    first.scrollIntoView({ block:"center", behavior:"smooth" });
  }
}

/* 父单小箭头：展开 / 收起该单的变更履历子单 */
function toggleHist(oid){
  if(!oid) return;
  if(histOpen.has(oid)) histOpen.delete(oid); else histOpen.add(oid);
  renderOrderTable();
  if(histOpen.has(oid)){
    const tr = el("pOrderTable").querySelector(`tr.orow[data-oid="${esc(oid)}"]`);
    if(tr) tr.scrollIntoView({ block:"nearest", behavior:"smooth" });
  }
}

function renderPlatform(L){
  if(!L || !L.orders){
    el("pOrderTable").innerHTML = emptyState("🔌", "台账暂未加载",
      "请确认后台服务已启动后刷新页面。");
    el("pTaskTable").innerHTML = "";
    return;
  }
  LAST_LEDGER = L;
  const orders=L.orders||[], tasks=L.tasks||[];
  if(el("modeBadge")) el("modeBadge").textContent = L.mode||"";
  el("pOrderCount").textContent = "（"+orders.length+" 笔）";
  el("pTaskCount").textContent = "（"+tasks.length+" 项）";
  renderOrderTable(orders);
  el("pTaskTable").innerHTML = tasks.length ? (
    "<table><tr><th>事项</th><th>责任人</th><th>期限</th><th>状态</th></tr>"+
    taskRows(tasks)+"</table>") : emptyState("🗂️", "台账还没有任务",
      "瓯单通会从群聊里自动识别待办，指派负责人和期限，并跟着订单一起留痕。",
      "「小周，周五前把样品寄给王总」→ 自动记一条待办");
  renderStats(L);
}
function renderStats(L){
  const orders=L.orders||[], tasks=L.tasks||[];
  const inProg = orders.filter(o=>!["已交付","已取消"].includes(o.status)).length;
  const delivered = orders.filter(o=>o.status==="已交付").length;
  const cancelled = orders.filter(o=>o.status==="已取消").length;
  const data = [
    {n:orders.length, t:"订单总数"}, {n:inProg, t:"在途"},
    {n:delivered, t:"已交付"}, {n:cancelled, t:"已取消"}, {n:tasks.length, t:"任务总数"},
  ];
  el("stats").innerHTML = data.map(d=>`<div class="stat"><div class="n">${d.n}</div><div class="t">${d.t}</div></div>`).join("");
}

/* 进入平台页 / 初始化 / 重置后都会调用：拉取台账并渲染 */
async function refreshPlatform(){
  try{
    const L = await apiGet("/api/ledger");
    renderPlatform(L);
  }catch(e){ showErr("加载台账失败："+e.message); }
}

/* ---------- 平台：查询 / 简报 / 重置 ---------- */
/* 查询反馈三条路（用户 2026-10-23 定稿）：
   ① 命中订单 → 查询区不出任何结果栏，直接跳到「📦 订单台账」那一笔并浅蓝高亮；
   ② 问的是简报 → 落到「📊 今日简报」面板，不占查询区；
   ③ 没法用高亮表达的（多单待澄清 / 无命中 / 解析入库回执）→ 才在查询区下浮一行提示。 */
function note(text, tone){
  const n = el("qNote"); if(!n) return;
  if(!text){ n.className = "q-note"; n.textContent = ""; return; }
  n.className = "q-note show" + (tone ? " " + tone : "");
  n.textContent = text;
}
let toastTimer = null;
function toast(html){
  let t = el("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.innerHTML = html;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2800);
}

/* 把查询结果落到台账上：定位 + 高亮 +（履历查询时）自动展开子单 */
function applyQuery(data){
  const f = (data && data.focus) || {};
  const ids = Array.isArray(f.order_ids) ? f.order_ids.slice() : [];
  const kind = f.kind || "";

  if(data.mode === "briefing" || kind === "briefing"){
    if(el("briefResult")) el("briefResult").textContent = stripNote(data.reply||"（无结果）");
    toast("📊 简报已生成 → 右下方「今日简报」");
    return;
  }
  if((kind === "orders" || kind === "history") && ids.length){
    HIT_IDS = ids;
    if(kind === "history") ids.forEach(id=>histOpen.add(id));   /* 履历查询：连子单一起展开 */
    renderOrderTable();
    applyHit(true);
    toast(kind === "history"
      ? `📜 已定位 <span class="tk">${esc(ids[0])}</span> 并展开变更履历（子单）`
      : ids.length > 1
        ? `🔍 命中 <span class="tk">${ids.length}</span> 笔，已在台账中高亮`
        : `🔍 已定位 <span class="tk">${esc(ids[0])}</span>，台账中浅蓝高亮`);
    return;
  }
  if(kind === "clarify" && ids.length){
    HIT_IDS = ids;
    renderOrderTable(); applyHit(true);
    note(stripNote(data.reply||""), "info");
    toast(`🤔 ${ids.length} 笔都匹配，请补充产品名或单号`);
    return;
  }
  if(kind === "fallback"){
    /* 未精确命中：后端不再回传单号，这里直接按台账把「在途单」全点亮，
       用户一眼看到的是"我手上还有这几单"，而不是一段文字列表 */
    const all = ((LAST_LEDGER && LAST_LEDGER.orders) || [])
      .filter(o=>!["已交付","已取消"].includes(o.status))
      .map(o=>o.order_id);
    if(all.length){
      HIT_IDS = all;
      renderOrderTable(); applyHit(true);
      note("未精确命中，已在台账高亮全部在途单（"+all.length+" 笔）。换个称呼或按产品问更准，如「法兰那单到哪了」。", "info");
      return;
    }
    note(stripNote(data.reply||"（无结果）"));
    return;
  }
  /* 无单可定位（解析入库回执 / 闲聊提示 / 台账为空）：如实把文本放出来，绝不静默 */
  note(stripNote(data.reply||"（无结果）"));
}

async function doQuery(){
  const inp = el("qInput");
  if(!inp) return;
  const t = inp.value.trim();
  // 旧版这里 if(!t) return 静默退出 —— 用户点「查询」什么都没发生，观感就是"按钮坏了"。
  if(!t){
    note("请先输入要查的内容，或点下方示例。例如：「法兰那单到哪了？」", "info");
    inp.focus();
    return;
  }
  note("");
  const btn = document.querySelector(".query-box button");
  if(btn) btn.disabled = true;
  toast("⏳ 查询中…");
  try{
    const data = await chatPost({message:t});
    if(data.ledger) renderPlatform(data.ledger);   /* 先刷新台账，保证查到的是最新写入 */
    applyQuery(data);
  }catch(e){
    note("⚠️ 查询失败：" + e.message, "warn");
    toast('<span class="t-warn">⚠️ 查询失败，请重试</span>');
    showErr("查询失败："+e.message);
  }finally{
    if(btn) btn.disabled = false;
  }
}
function qExample(t){
  const inp = el("qInput"); if(!inp) return;
  inp.value = t; doQuery();
}
async function doBriefing(){
  const out = el("briefResult"); if(!out) return;
  out.textContent = "⏳ 正在生成简报…";
  try{
    const data = await chatPost({message:"出今日简报"});
    out.textContent = stripNote(data.reply||"（无结果）");
  }catch(e){
    out.textContent = "⚠️ 生成简报失败：" + e.message;
    showErr("生成简报失败："+e.message);
  }
}
async function resetAll(){
  try{
    await apiPost("/api/reset");
    if(el("wxChat")) el("wxChat").innerHTML="";
    if(el("briefResult")) el("briefResult").textContent="点击上方按钮生成今日简报。";
    /* 台账清空后旧的定位/展开状态必须一起清掉，否则会指向不存在的单 */
    HIT_IDS = []; histOpen.clear(); note("");
    addWx("agent","台账已清空，可重新模拟客户发消息。","hint");
    await refreshPlatform();
  }catch(e){ showErr("重置失败："+e.message); }
}

/* ---------- 初始化 ---------- */
function renderChatButtons(){
  const box = el("wxActions");
  CHAT_SCENARIOS.forEach(s=>{
    const b=document.createElement("button"); b.className="cbtn"; b.textContent=s.label;
    b.onclick=()=>wxSendScenario(s); box.appendChild(b);
  });
}
/* 台账用事件委托：小箭头是每次重渲染生成的，绑在容器上才不会随 innerHTML 一起失效 */
function bindOrderTable(){
  const box = el("pOrderTable"); if(!box) return;
  box.addEventListener("click", function(ev){
    const btn = ev.target.closest ? ev.target.closest(".hist-toggle") : null;
    if(!btn) return;
    ev.preventDefault();
    toggleHist(btn.dataset.oid);
  });
}
async function init(){
  renderChatButtons();
  bindOrderTable();
  await refreshPlatform();   /* 失败已在内部提示，不阻断欢迎语 */
  addWx("agent","我是瓯单通，已接入本群。客户在微信里发的订单消息，我会自动提取成台账。\n点下方按钮，模拟客户发来 5 类消息 👇","hint");
}
init();
</script>
