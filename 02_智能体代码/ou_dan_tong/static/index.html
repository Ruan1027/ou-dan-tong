<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>瓯单通 · 订单协同智能体</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f4f6fb; --card:#fff; --brand:#2563eb; --brand2:#1e40af;
          --ok:#16a34a; --warn:#dc2626; --muted:#64748b; --line:#e5e7eb;
          --wx-bg:#ededed; --wx-in:#ffffff; --wx-out:#95ec69; --wx-head:#ededed; }
  body { font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background: var(--bg); color:#0f172a; height:100vh; display:flex; flex-direction:column; }
  /* —— 顶栏 + 分页签 —— */
  header { background: linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff;
           padding:0 18px; display:flex; align-items:center; gap:14px; height:58px; flex-shrink:0; }
  header .logo { font-size:20px; font-weight:800; letter-spacing:1px; }
  header .tag { font-size:12px; opacity:.9; }
  .tabs { display:flex; gap:8px; margin-left:18px; }
  .tab-btn { background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:999px;
             padding:6px 16px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .tab-btn.active { background:#fff; color:var(--brand2); }
  header .mode { margin-left:auto; font-size:12px; background:rgba(255,255,255,.18);
                padding:4px 10px; border-radius:999px; }
  /* 口语化开关（模块四 C-1）：默认关＝模板直出，勾上＝允许 LLM 改写 */
  header .colloqui { display:flex; align-items:center; gap:6px; font-size:12px;
                     background:rgba(255,255,255,.18); padding:4px 10px; border-radius:999px;
                     cursor:pointer; user-select:none; }
  header .colloqui input { margin:0; cursor:pointer; }
  main { flex:1; overflow:hidden; padding:14px; }
  .tab { display:none; height:100%; }
  .tab.active { display:flex; gap:14px; }

  /* ========== Tab1 · 微信沟通模拟 ========== */
  .wechat { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--wx-bg);
            border-radius:14px; overflow:hidden; border:1px solid var(--line); }
  .wx-head { background:var(--wx-head); padding:10px 14px; font-size:14px; font-weight:600;
             color:#1f2937; border-bottom:1px solid #e0e0e0; display:flex; align-items:center; gap:8px; }
  .wx-head .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); }
  .wx-note { background:#fffbeb; color:#92600a; font-size:12px; padding:6px 14px; border-bottom:1px solid #fde68a; }
  /* scrollbar-gutter:stable —— 滚动条常驻占位，消息增减不再改变内容可用宽度 */
  .wx-chat { flex:1; overflow-y:auto; scrollbar-gutter:stable; padding:16px 14px; }
  .row { display:flex; gap:8px; margin-bottom:14px; align-items:flex-start; }
  .row.customer { flex-direction:row; }
  .row.agent { flex-direction:row-reverse; }
  .avatar { width:38px; height:38px; border-radius:6px; flex-shrink:0; display:flex;
            align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#fff; }
  .avatar.cust { background:#94a3b8; }
  .avatar.agent { background:var(--brand); }
  /* 消息列：宽度约束放列上，气泡本身自适应内容；保证气泡边缘始终贴头像 */
  .col { display:flex; flex-direction:column; max-width:74%; min-width:0; }
  .row.customer .col { align-items:flex-start; }
  .row.agent .col { align-items:flex-end; }
  .bubble { max-width:100%; padding:9px 12px; border-radius:8px; line-height:1.55; font-size:14px;
            white-space:pre-wrap; word-break:break-word; position:relative; }
  .row.customer .bubble { background:var(--wx-in); color:#111; border-top-left-radius:2px; }
  .row.agent .bubble { background:var(--wx-out); color:#111; border-top-right-radius:2px; }
  .cap { font-size:11px; color:var(--muted); margin-bottom:3px; }
  .row.customer .cap { text-align:left; }
  .row.agent .cap { text-align:right; }
  .wx-actions { display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px; background:var(--wx-head);
                border-top:1px solid #e0e0e0; }
  .wx-actions .lbl { width:100%; font-size:11.5px; color:var(--muted); }
  .cbtn { border:1px solid #cbd5e1; background:#fff; color:#0f172a; border-radius:10px;
          padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  .cbtn:hover { background:#f1f5f9; }
  .wx-input { display:flex; gap:8px; padding:10px 14px; background:#f7f7f7; border-top:1px solid #e0e0e0; }
  /* 发言人输入框：平台直接面向顾客，发信人即客户本人，必须随消息一起传下去 */
  .wx-input .wx-sender { width:80px; flex:0 0 auto; height:42px; border:1px solid var(--line);
                         border-radius:10px; padding:0 10px; font-size:13px; font-family:inherit;
                         text-align:center; color:var(--brand2); font-weight:600; }
  .wx-input textarea { flex:1; resize:none; height:42px; border:1px solid var(--line); border-radius:10px;
                       padding:9px 12px; font-size:14px; font-family:inherit; }
  .wx-input button { border:none; border-radius:10px; padding:0 18px; font-weight:600; cursor:pointer;
                     background:var(--brand); color:#fff; flex:0 0 auto; }

  /* ========== 通用：表格 / 状态徽章 ========== */
  /* 注意：.panel / .panel h3 的实际定义在下方「Tab2」段落，此处不要再定义一份，
     否则旧的 overflow:hidden 会残留并继续裁剪面板内容（本页曾因此踩坑）。 */
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; white-space:nowrap; }
  .b-沟通中{background:#fef9c3;color:#854d0e;} .b-已报价{background:#dbeafe;color:#1e40af;}
  .b-已确认{background:#ede9fe;color:#5b21b6;} .b-生产中{background:#dcfce7;color:#166534;}
  .b-已交付{background:#e2e8f0;color:#475569;} .b-部分交付{background:#ffedd5;color:#9a3412;}
  .b-待补充{background:#fee2e2;color:#b91c1c;} .b-已取消{background:#f1f5f9;color:#64748b;}
  .b-追加{background:#ffedd5;color:#9a3412;}
  .empty { color:var(--muted); font-size:12.5px; }

  /* ========== Tab2 · 平台汇总 ========== */
  /* 布局：固定视口高度 + 三行结构，每块内部独立滚动。
     这样任何一块数据变多都只在自身内部滚，绝不压缩/顶飞其他块
     （旧版用整页 overflow-y:auto + 面板 overflow:hidden，订单变多后
       把查询输入框和按钮裁掉，表现就是"按钮点了没反应"）。 */
  #tab-platform { display:flex; flex-direction:column; gap:12px; height:100%; overflow:hidden; }
  .p-row { display:flex; gap:12px; min-height:0; }
  .p-row-top  { flex:0 0 auto; }
  .p-row-main { flex:1 1 auto; min-height:0; }
  .p-row-foot { flex:0 0 auto; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  @supports not (scrollbar-gutter: stable) {
    .wx-chat { overflow-y:scroll; }
  }

  /* 统计卡：5 等分自适应，不再写死 118px */
  .stats { flex:0 0 auto; display:grid; grid-template-columns:repeat(5, minmax(88px, 1fr));
           gap:10px; min-width:0; max-width:680px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:12px 6px; text-align:center; min-width:0; }
  .stat .n { font-size:22px; font-weight:800; color:var(--brand2); line-height:1.2; }
  .stat .t { font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis; }

  /* 面板：纵向容器，标题固定、内容区独立滚动 —— 不挤压的关键 */
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px;
           padding:12px 14px; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .panel h3 { font-size:14px; margin-bottom:8px; color:var(--brand2); flex:0 0 auto;
              display:flex; align-items:baseline; gap:6px; white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }
  .panel h3 small { color:var(--muted); font-weight:400; font-size:11.5px; }
  .panel-body { flex:1 1 auto; min-height:0; overflow:auto; scrollbar-gutter:stable; margin-top:6px; }

  /* 第一行：统计卡 + 订单查询（查询常驻右上，不用往下滚） */
  .panel-query { flex:1 1 auto; }
  .p-row-top .query-box { flex:0 0 auto; }

  /* 第二行：订单台账 / 任务台账 / 今日简报，比例固定 */
  .p-order { flex:0 0 calc(50% - 8px); }
  .p-task  { flex:0 0 calc(22% - 8px); }
  .p-brief { flex:1 1 auto; }
  .p-brief .brief-btn { flex:0 0 auto; margin-bottom:8px; }
  /* ===== 订单台账 · 筛选器（视觉参照 macOS 排序菜单）=====
     注意：`.panel` 是 overflow:hidden，下拉若作为面板子元素会被直接裁掉，
     所以菜单用 position:fixed 挂在 body 上，按按钮的 getBoundingClientRect() 定位。 */
  .panel-tools { margin-left:auto; align-self:center; display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .flt-btn { display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 9px;
             border:1px solid var(--line); background:#f7f7f7; color:#334155; border-radius:9px;
             font-size:12.5px; font-family:inherit; font-weight:600; cursor:pointer; white-space:nowrap; }
  .flt-btn:hover { background:#f1f5f9; }
  .flt-btn[aria-expanded="true"] { background:#eef2ff; border-color:#c7d2fe; color:var(--brand); }
  .flt-btn .flt-ico { width:13px; height:13px; display:block; }
  .flt-btn .chev { font-size:10px; color:var(--muted); margin-left:1px; }
  .flt-badge { min-width:15px; height:15px; padding:0 4px; border-radius:999px; background:var(--brand);
               color:#fff; font-size:10px; line-height:15px; text-align:center; font-weight:700; }
  .flt-badge[hidden] { display:none; }

  /* 宽度必须是确定值：两列 grid 的 1fr 需要父宽才能分配；窄视口用 100vw-24px 封顶，
     与 placeFilterMenu() 的 8px 边距同源，绝不溢出 */
  .flt-menu { position:fixed; z-index:60; width:min(480px, calc(100vw - 24px)); max-height:70vh; overflow:auto;
              background:#fff; border:1px solid var(--line); border-radius:12px;
              box-shadow:0 10px 30px rgba(15,23,42,.14); padding:6px 0; font-size:13px; }
  .flt-menu[hidden] { display:none; }
  .flt-title { padding:4px 14px 5px; font-size:11px; color:var(--muted); }
  .flt-opt { display:flex; align-items:center; gap:8px; width:100%; padding:7px 14px;
             border:0; background:transparent; font-size:13px; font-family:inherit;
             color:#1f2937; text-align:left; cursor:pointer; }
  .flt-opt:hover { background:#f1f5f9; }
  .flt-opt .mk { flex:0 0 14px; width:14px; text-align:center; color:var(--brand); font-size:12px; }
  /* min-width:0 是必须的：两列时列宽约 207px，原先的 max-width:252px 会横向溢出 */
  .flt-opt .lb { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .flt-opt .arw { flex:0 0 auto; color:var(--muted); font-size:11px; }
  .flt-sep { height:1px; background:var(--line); margin:6px 0; }
  .flt-input { width:calc(100% - 28px); margin:2px 14px 6px; height:28px; padding:0 9px;
               border:1px solid var(--line); border-radius:8px; font-size:12.5px; font-family:inherit; }
  .flt-input:focus { outline:none; border-color:#c7d2fe; box-shadow:0 0 0 2px #eef2ff; }
  .flt-sub { position:fixed; z-index:61; min-width:200px; max-height:50vh; overflow:auto;
             background:#fff; border:1px solid var(--line); border-radius:10px;
             box-shadow:0 10px 30px rgba(15,23,42,.14); padding:5px 0; }
  .flt-sub[hidden] { display:none; }
  .flt-reset { color:#b91c1c; }
  /* .flt-opt 是 display:flex，会盖掉 UA 的 [hidden]{display:none}，「更多」靠 hidden 控制必须补这条 */
  .flt-opt[hidden] { display:none; }

  /* ---- 菜单两列分栏：左列状态+交期，右列客户+单号，重置跨列置底 ---- */
  .flt-cols { display:grid; grid-template-columns:1fr 1fr; column-gap:10px; }
  /* min-width:0 不能省：grid 的 1fr 隐含 min-width:auto(=min-content)，
     长客户名会把列撑破，导致 ellipsis 失效、菜单超出 max-width */
  .flt-col { min-width:0; }
  @media (max-width: 480px) { .flt-cols { grid-template-columns:1fr; } }

  /* ---- 客户搜索框（tag 嵌在输入框内部） ---- */
  .flt-combo { display:flex; flex-wrap:wrap; align-items:center; gap:4px;
               width:calc(100% - 28px); margin:2px 14px 6px; padding:3px 6px;
               min-height:32px; border:1px solid var(--line); border-radius:8px;
               font-size:12.5px; background:#fff; cursor:text; }
  .flt-combo:focus-within { border-color:#c7d2fe; box-shadow:0 0 0 2px #eef2ff; }
  .flt-combo input { flex:1 1 60px; min-width:60px; height:22px; border:0; outline:none;
                     background:transparent; font:inherit; color:inherit; padding:0; }
  .flt-tag { display:inline-flex; align-items:center; gap:4px; max-width:100%;
             background:#e0e7ff; color:var(--brand2); border:1px solid #c7d2fe;
             border-radius:999px; padding:1px 4px 1px 8px; font-size:11.5px; line-height:1.6; }
  .flt-tag .tx { min-width:0; max-width:110px; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
  .flt-tag .x { border:0; background:transparent; color:var(--brand2); cursor:pointer;
                font-size:12px; line-height:1; padding:0 3px; border-radius:999px; }
  .flt-tag .x:hover { background:#c7d2fe; }

  /* ---- 客户候选列表 ---- */
  /* 必须自己滚：父级 .flt-menu 已是 70vh 上限，候选一多会把输入框滚出视口，
     而用户正在打字。overscroll-behavior 防止滚动链传给父级造成双滚动条抢鼠标 */
  .flt-cand { max-height:min(38vh, 240px); overflow:auto; overscroll-behavior:contain; }
  .flt-cand-empty { padding:6px 14px 8px; color:var(--muted); font-size:12px; }
  .flt-cand .flt-opt.hi { background:#eef2ff; }

  /* 台账表 + 表头吸顶（基础 table 样式见上「通用」段，此处不再重复定义）。
     订单台账加「单价」列后共 7 列：弃用 6 列时代的 table-layout:fixed + 百分比列宽
     （那套规则会让状态列分不到宽度挤成竖排、单价列拉出大片空白）。
     改为列宽按内容自适应 + 单元格不折行，任何字段都完整可读；
     表格超宽时由 .panel-body 的 overflow:auto 提供横向滚动，列不会被截断或挤出屏外。
     任务台账仍 4 列，维持固定列宽不变。 */
  #pOrderTable table { table-layout:auto; min-width:100%; }
  #pOrderTable th, #pOrderTable td { white-space:nowrap; }
  /* 履历子行是多行长文本，必须恢复正常折行 */
  #pOrderTable tr.hist-row > td { white-space:normal; }
  /* 缩小「单价」与「交期」列间距：单价右缘收 2px，排版更紧凑 */
  #pOrderTable th:nth-child(5), #pOrderTable td:nth-child(5) { padding-right:2px; }
  #pTaskTable table { table-layout:fixed; }
  #pTaskTable th:nth-child(1){width:40%} #pTaskTable th:nth-child(2){width:18%}
  #pTaskTable th:nth-child(3){width:22%} #pTaskTable th:nth-child(4){width:20%}
  #pOrderTable table tr:first-child th,
  #pTaskTable table tr:first-child th {
    position:sticky; top:0; z-index:1; background:var(--card);
    box-shadow:inset 0 -1px 0 var(--line); }
  td { overflow-wrap:anywhere; }

  /* 空状态：告诉用户这块是干什么用的、怎么才会有数据 */
  .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center;
                 text-align:center; padding:16px 8px; gap:6px; }
  .empty-state .es-icon { font-size:26px; opacity:.7; }
  .empty-state .es-title { font-size:13px; font-weight:600; color:#475569; }
  .empty-state .es-desc { font-size:12px; line-height:1.6; color:var(--muted); max-width:270px; }
  .empty-state .es-eg { font-size:11.5px; color:#94a3b8; background:#f8fafc;
                        border:1px dashed var(--line); border-radius:8px; padding:6px 10px;
                        margin-top:2px; max-width:270px; line-height:1.5; }

  .query-box { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .query-box input { flex:1 1 160px; min-width:0; height:38px; border:1px solid var(--line);
                     border-radius:9px; padding:0 12px; font-size:13.5px; font-family:inherit; }
  .query-box button { border:none; border-radius:9px; padding:0 18px; height:38px; font-weight:600;
                      cursor:pointer; background:var(--brand); color:#fff; flex:0 0 auto; }
  .query-box button:hover { background:var(--brand2); }
  .qchips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; flex:0 0 auto; }
  .qchip { background:#e0e7ff; color:var(--brand2); border:1px solid #c7d2fe; border-radius:999px;
           padding:4px 11px; font-size:12px; cursor:pointer; }
  .qchip:hover { background:#c7d2fe; }
  .result { background:#f8fafc; border:1px dashed var(--line); border-radius:8px;
            padding:10px 12px; font-size:13px; line-height:1.6; white-space:pre-wrap;
            min-height:40px; color:#1f2937; overflow-wrap:anywhere; }
  /* —— 今日简报：结构化排版（只作用于简报面板内部，面板本身布局尺寸不动）——
     标题行分隔 → 条目卡片（图标 + 名称 + 数量大字徽章）→ 人名/日期等明细下沉为说明行。
     关键要点（各类数量）一眼可见，细节不抢主信息。 */
  #briefResult .brief { display:flex; flex-direction:column; gap:7px; }
  #briefResult .brief-head { display:flex; align-items:center; gap:6px;
            font-size:13px; font-weight:700; color:#1e293b;
            padding-bottom:7px; border-bottom:1px solid var(--line); }
  #briefResult .brief-item { background:#fff; border:1px solid var(--line);
            border-left:3px solid var(--brand); border-radius:8px; padding:7px 9px; }
  #briefResult .brief-line { display:flex; align-items:baseline; gap:5px; font-size:12.5px; color:#334155; }
  #briefResult .brief-label { font-weight:600; }
  #briefResult .brief-num { font-size:17px; font-weight:800; color:var(--brand); line-height:1; }
  #briefResult .brief-unit { font-size:11.5px; color:var(--muted); }
  #briefResult .brief-sub { margin-top:3px; font-size:11.5px; line-height:1.55;
            color:var(--muted); overflow-wrap:anywhere; }
  #briefResult .brief-sub + .brief-sub { margin-top:1px; }
  /* 新增订单：客户 | 产品 双列，逐行左对齐（产品列由台账数据按客户匹配补出） */
  #briefResult .brief-pair-head { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
            gap:0 10px; margin-top:4px; padding-bottom:2px; border-bottom:1px dashed var(--line); }
  #briefResult .brief-pair-head span { font-size:10.5px; font-weight:700; letter-spacing:1px;
            color:#94a3b8; }
  #briefResult .brief-pair { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
            gap:0 10px; margin-top:1px; }
  #briefResult .brief-pair:first-of-type { margin-top:4px; }
  #briefResult .brief-pair .brief-sub { margin-top:0; }
  #briefResult .brief-prod { color:#475569; }
  /* 沟通中 / 临期交付：客户 | 交期 双列，逐行左对齐（交期统一「还有XX天（交期 yyyy-mm-dd）」） */
  #briefResult .brief-duo-head { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
            gap:0 10px; margin-top:4px; padding-bottom:2px; border-bottom:1px dashed var(--line); }
  #briefResult .brief-duo-head span { font-size:10.5px; font-weight:700; letter-spacing:1px;
            color:#94a3b8; }
  #briefResult .brief-duo { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);

  /* —— 轻提示：定位/展开这类一句话反馈，2.8s 自动消失，不占版面 —— */

<div id="errBanner" style="display:none;position:fixed;left:0;right:0;bottom:0;background:#dc2626;color:#fff;padding:10px 16px;font-size:13px;z-index:99;box-shadow:0 -2px 8px rgba(0,0,0,.2);"></div>

<script>
/* sender = 微信群里的发言人昵称。真实微信群每条消息都带它，必须一并传给智能体：
   否则「小陈，DZ47 那个加到 80 个」这类客户自报消息会因为正文没写客户名
   被抽成 customer=null，整条被当作「信息不全」丢弃。 */
const CHAT_SCENARIOS = [
  { label:"🆕 客户新建订单", scenario:"new", sender:"阿珍",
    text:"老周，秋季那款运动鞋鞋底 EVA 发泡的，先给我 800 双，最好 11 月 10 号前到，客户催得紧" },
  { label:"✏️ 客户改数量", scenario:"update", sender:"李姐",
    text:"小陈，DZ47 那个加到 80 个" },
  { label:"📥 客户追加订单", scenario:"append", sender:"王总",
    text:"小陈，法兰那批的货再排一批 300 个的，单价还是 18.5，11-15 交，跟原来那单分开走" },
  { label:"🟡 客户信息缺失", scenario:"missing", sender:"王总",
    text:"小陈，法兰那批的货再帮我排上一批，我这边急" },
  { label:"⚠️ 客户数据冲突", scenario:"conflict", sender:"王总",
    text:"小陈，法兰 DN80 那单单价你按 18 算，上次说好的" },
  { label:"⛔ 客户异常拦截", scenario:"abnormal", sender:"李姐",
    text:"小陈，DZ47 那个数量给我改成 -300" },
];
const SIM_NOTE = "⚠️ 模拟模式";

function el(id){ return document.getElementById(id); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function stripNote(t){ const i=(t||"").indexOf("\n\n"+SIM_NOTE); return (i>=0?t.slice(0,i):t).trim(); }
function modeCap(m){ return ({parse:"📦 提取入库", query:"🔍 订单查询", briefing:"📊 今日简报", hint:"💡 提示"})[m]||""; }

/* 错误横幅：任何未捕获异常/网络失败都可见，避免静默空白 */
function showErr(m){ const b=el("errBanner"); if(!b) return; b.style.display="block"; b.textContent="⚠️ "+m; }
window.addEventListener("error", function(e){ showErr("页面脚本异常："+(e.message||(e.error&&e.error.message)||"未知错误")); });

/* 统一接口封装：带错误处理，失败抛错由调用方决定提示方式 */
async function apiGet(path){
  const r = await fetch(path, {headers:{"Accept":"application/json"}});
  if(!r.ok) throw new Error("HTTP "+r.status+" "+path);
  return await r.json();
}
async function apiPost(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
    body: body?JSON.stringify(body):"{}"});
  if(!r.ok) throw new Error("HTTP "+r.status+" "+path);
  return await r.json();
}

/* 会话 id（模块四 C-2）：多轮指代消解靠它隔离上下文。
   同一浏览器保持同一个 id，换个标签页/换个人演示就是另一份上下文，不会串话。 */
const SID = (function(){
  try{
    let v = localStorage.getItem("ou_sid");
    if(!v){ v = "s" + Math.random().toString(36).slice(2,10); localStorage.setItem("ou_sid", v); }
    return v;
  }catch(e){ return "default"; }   /* 隐私模式禁用 localStorage 时退化为单会话 */
})();

/* 统一的对话请求：自动带上会话 id 与「口语化」开关，避免各调用点漏传。
   漏传的两个后果都很难查：上下文串到别人那、口语化按钮点了没反应。 */
function chatPost(body){
  const t = el("colloquialToggle");
  return apiPost("/api/chat", Object.assign({}, body, {
    sid: SID,
    colloquial: !!(t && t.checked)
  }));
}

function switchTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  el("tab-"+name).classList.add("active");
  Array.from(document.querySelectorAll(".tab-btn")).forEach(b=>{
    if(b.textContent.includes(name==="chat"?"微信":"平台")) b.classList.add("active");
  });
  /* 每次进入平台页都重新拉取，保证数据最新、且能从初始加载失败中恢复 */
  if(name==="platform") refreshPlatform();
}

/* ---------- 微信气泡 ---------- */
function addWx(role, text, mode, sender){
  const wrap = document.createElement("div");
  wrap.className = "row " + (role==="customer"?"customer":"agent");
  const av = document.createElement("div");
  av.className = "avatar " + (role==="customer"?"cust":"agent");
  av.textContent = role==="customer" ? (sender ? sender.slice(0,1) : "客") : "瓯";
  const col = document.createElement("div"); col.className = "col";
  if(role==="agent"){
    const cap = document.createElement("div"); cap.className="cap"; cap.textContent = modeCap(mode);
    col.appendChild(cap);
  } else if(sender){
    /* 显示发言人昵称：还原微信群真实形态，也让人一眼看到「客户身份」从哪来 */
    const cap = document.createElement("div"); cap.className="cap"; cap.textContent = sender;
    col.appendChild(cap);
  }
  const b = document.createElement("div"); b.className="bubble"; b.textContent = text;
  col.appendChild(b);
  wrap.appendChild(av); wrap.appendChild(col);
  el("wxChat").appendChild(wrap);
  el("wxChat").scrollTop = el("wxChat").scrollHeight;
}

/* 等待占位气泡：网关单次响应 18~50s，没有反馈用户会以为卡死 */
function addWxPending(){
  const wrap = document.createElement("div");
  wrap.className = "row agent";
  const av = document.createElement("div"); av.className = "avatar agent"; av.textContent = "瓯";
  const col = document.createElement("div"); col.className = "col";
  const cap = document.createElement("div"); cap.className="cap"; cap.textContent = "⏳ 解析中";
  const b = document.createElement("div"); b.className="bubble";
  const t0 = Date.now();
  b.textContent = "正在提取订单要素…";
  const timer = setInterval(()=>{
    b.textContent = `正在提取订单要素… 已等待 ${Math.round((Date.now()-t0)/1000)}s`;
  }, 1000);
  col.appendChild(cap); col.appendChild(b);
  wrap.appendChild(av); wrap.appendChild(col);
  el("wxChat").appendChild(wrap);
  el("wxChat").scrollTop = el("wxChat").scrollHeight;
  return { remove(){ clearInterval(timer); wrap.remove(); } };
}

async function wxSend(text, scenario, sender){
  if(!text) return;
  addWx("customer", text, null, sender);
  const pending = addWxPending();
  try{
    const data = await chatPost({message:text, scenario: scenario||null, sender: sender||null});
    pending.remove();
    addWx("agent", stripNote(data.reply||"（无回复）"), data.mode);
    if(data.ledger) renderPlatform(data.ledger);
  }catch(e){
    pending.remove();
    showErr("发送失败："+e.message); addWx("agent","（网络异常，未能连接智能体）","hint");
  }
}
function wxSendInput(){
  const i = el("wxInput"); if(!i) return;
  const t = i.value.trim();
  if(!t){ i.focus(); return; }
  /* 手动输入也必须带上发言人：缺了它，后端只能判「缺少客户信息」，
     而本平台面向顾客，发信人本来就是客户本人。 */
  const sEl = el("wxSender");
  const s = (sEl && sEl.value.trim()) || "客户";
  wxSend(t, null, s);
  i.value = "";
}
async function wxSendScenario(s){ await wxSend(s.text, s.scenario, s.sender); }

/* ---------- 键盘交互：Enter 发送 / Shift+Enter 换行 ----------
   keyAction 是纯函数（无副作用、不碰 DOM），便于脱离浏览器做表驱动测试：
   输入法判定最容易「看着对、实际错」，能被单测钉住才可靠。
   返回 "send" | "newline" | "ignore"。
   组合输入态返回 "ignore"：此时 Enter 是「上屏选词」，必须原样交还输入法。 */
function keyAction(e, composing){
  if(!e || e.key !== "Enter") return "ignore";
  if(composing || e.isComposing || e.keyCode === 229) return "ignore";
  if(e.shiftKey) return "newline";
  return "send";
}

/* 把 Enter 绑定到发送。三重 IME 判定缺一不可：
     · e.isComposing  标准字段，Chrome/Firefox 组合态为 true
     · keyCode === 229 旧版 Chromium / 部分输入法在组合态给 229
     · composing 闭包标志  兜 Safari——它在「上屏那一次」的 keydown 里
       isComposing 可能已是 false，且 compositionend 可能早于 keydown，
       故在 compositionend 里用 setTimeout(0) 延迟清除，保证同一任务内的
       keydown 仍读到 true。
   guard 返回 false 时不发送（查询框请求进行中防重复触发）。
   Shift+Enter 一律不 preventDefault，把换行留给浏览器默认行为。 */
function bindEnterToSend(node, onSend, guard){
  if(!node) return;
  let composing = false;
  node.addEventListener("compositionstart", function(){ composing = true; });
  node.addEventListener("compositionend", function(){
    setTimeout(function(){ composing = false; }, 0);
  });
  node.addEventListener("keydown", function(e){
    const act = keyAction(e, composing);
    if(act !== "send") return;          /* newline / ignore 一律不拦截 */
    e.preventDefault();                  /* 阻止 Enter 插入换行 */
    if(guard && !guard()) return;
    onSend();
  });
}

/* ---------- 台账渲染 ---------- */
/* 变更履历（changes[] / change_log）在台账里以「子单」形式展开：
   父单行内给一个小箭头入口，点开后紧跟一行 colspan 子行，逐条列出改动。
   展开状态记在 histOpen 里，重渲染（刷新台账 / 再查询）后保持不塌。 */
const FIELD_LABEL = { qty:"数量", unit_price:"单价", delivery_date:"交期", status:"状态",
                      spec:"规格", sample_flag:"样品", customer:"客户", product:"产品",
                      delivered_qty:"已交数量", remain_qty:"余量" };
const histOpen = new Set();     /* 已展开变更履历的单号 */
let HIT_IDS = [];               /* 当前被定位高亮的单号 */
let LAST_LEDGER = null;         /* 最近一次台账快照：展开/收起时局部重渲染用 */

function orderHist(o){
  const h = o && (o.change_log || o.changes);
  return Array.isArray(h) ? h : [];
}
function fieldLabel(f){ return FIELD_LABEL[f] || f || "变更"; }
/* 一条 change 可能压了多个字段（field="qty,status"，old/new 用 " | " 拼），
   拆成「字段：旧 → 新」多条，避免子单里出现看不懂的逗号串。 */
function histParts(c){
  const fields = String(c.field == null ? "" : c.field).split(",").map(s=>s.trim()).filter(Boolean);
  const olds = String(c.old == null ? "—" : c.old).split(" | ");
  const news = String(c.new == null ? "—" : c.new).split(" | ");
  if(fields.length && fields.length === olds.length && fields.length === news.length){
    return fields.map((f,i)=>({ f:f, o:olds[i], n:news[i] }));
  }
  return [{ f: fields.join("/") || "变更",
            o: String(c.old == null ? "—" : c.old),
            n: String(c.new == null ? "—" : c.new) }];
}
function histHtml(hist){
  if(!hist.length) return `<div class="hist-empty">本单无变更记录（建单后未修改）。</div>`;
  /* 倒序：最新一条在最上面，与「查变更履历」的文字答案口径一致 */
  const items = hist.map((c,i)=>({ c:c, no:i+1 })).reverse();
  return `<div class="hist-list">` + items.map((it, i)=>{
    const c = it.c;
    const time = (c.time || "").replace("T"," ").slice(5,16);        /* MM-DD HH:MM */
    const who = c.speaker || "";
    const src = String(c.raw || c.source || "").trim();
    const parts = histParts(c).map(p=>
      `<span class="hi-field">${esc(fieldLabel(p.f))}</span>`+
      `<span class="hi-old">${esc(p.o)}</span>`+
      `<span class="hi-arr">→</span>`+
      `<span class="hi-nw">${esc(p.n)}</span>`).join("");
    return `<div class="hist-item">
      <div class="hi-top">
        ${hist.length > 1 ? `<span class="hi-idx">#${it.no}</span>` : ""}${i === 0 ? `<span class="hi-newest">最新</span>` : ""}
        ${parts}
        <span class="hi-time">${esc(time)}${who ? " · " + esc(who) : ""}</span>
      </div>
      ${src ? `<div class="hi-src">📎 ${esc(src)}</div>` : ""}
    </div>`;
  }).join("") + `</div>`;
}

/* 分批交期展示（C-13）：台账必须看得见「分几批、每批多少、各什么时候交」。
   否则客户说的「分两批：11-01 出 500，11-03 出 400」在屏上只剩一个总数和最终日期，
   等于分批这件事没被记录。 */
function batchNote(o){
  const bs = o && o.delivery_batches;
  if(!Array.isArray(bs) || !bs.length) return "";
  const items = bs.map(b=>`${String(b.date||"").slice(5)}×${b.qty}`).join(" / ");
  return `<div class="cap">分 ${bs.length} 批：${items}</div>`;
}

/* 单价列（位于数量之后）：数值型货币格式，统一保留两位小数。
   unit_price 落库是字符串（"18.5"/"26"/"待报价"），解析成功 → ¥18.50；
   「待报价」原样灰显提醒补价；缺失/非法 → 「—」，不显示 0 冒充已定价。 */
function priceCell(o){
  const raw = o && o.unit_price;
  const p = parseFloat(raw);
  if(Number.isFinite(p)) return `¥${p.toFixed(2)}`;
  if(String(raw||"").trim() === "待报价") return '<span class="cap">待报价</span>';
  return "—";
}

function orderRows(orders){
  /* 追加单必须一眼可辨：单号后打「追加」徽章，并在交期下注明追加自哪一单 */
  return orders.map(o=>{
    const oid = o.order_id || "";
    const tag = o.is_append ? ' <span class="badge b-追加">追加</span>' : '';
    const from = o.is_append && o.parent_order_id ? `<div class="cap">追加自 ${esc(o.parent_order_id)}</div>` : '';
    const hist = orderHist(o);
    const open = histOpen.has(oid);
    /* 有履历才给入口；没有就不放空箭头，避免点开一片空 */
    const histBtn = hist.length ? `<button type="button" class="hist-toggle${open ? " open" : ""}"`+
      ` data-oid="${esc(oid)}" aria-expanded="${open ? "true" : "false"}"`+
      ` title="展开 / 收起本单变更履历"><span class="arw">${open ? "▾" : "▸"}</span>变更履历 ${hist.length}</button>` : '';
    const row = `<tr class="orow" data-oid="${esc(oid)}"><td>${esc(oid)}${tag}${histBtn}</td>`+
      `<td>${esc(o.customer)}</td>`+
      `<td>${esc(o.product)}</td><td>${esc(o.qty)}</td><td>${priceCell(o)}</td><td>${esc(o.delivery_date||"—")}${batchNote(o)}${from}</td>`+
      `<td><span class="badge b-${esc(o.status)}">${esc(o.status)}</span></td></tr>`;
    const child = hist.length ? `<tr class="hist-row${open ? "" : " hidden"}" data-for="${esc(oid)}">`+
      `<td colspan="7">${histHtml(hist)}</td></tr>` : '';
    return row + child;
  }).join("");
}
function taskRows(tasks){
  return tasks.map(t=>`<tr><td>${esc(t.content)}</td><td>${esc(t.owner||"待认领")}</td>`+
    `<td>${esc(t.deadline||"待定")}</td><td>${esc(t.status)}</td></tr>`).join("");
}
/* 空状态：不只是说「暂无」，要讲清这块是干什么的、怎么才会有数据。
   任务台账没任务时尤其需要 —— 否则一张「0 项」的空卡看不出任何效用。 */
function emptyState(icon, title, desc, eg){
  return `<div class="empty-state">
    <div class="es-icon">${icon}</div>
    <div class="es-title">${title}</div>
    <div class="es-desc">${desc}</div>
    ${eg ? `<div class="es-eg">例：${eg}</div>` : ""}
  </div>`;
}

function renderOrderTable(orders){
  const box = el("pOrderTable"); if(!box) return;
  const all = (LAST_LEDGER && LAST_LEDGER.orders) || [];
  /* 无参调用（展开变更履历 / 查询定位 / 简报定位后的重渲染）也必须取「筛选后」集合，
     否则一展开履历就把当前筛选条件冲掉了 */
  orders = orders || filterOrders(all, ORDER_FILTER);
  if(orders.length){
    /* 7 列：单价由 dev-d 合入，位于数量与交期之间，勿回退成 6 列 */
    box.innerHTML = "<table><tr><th>单号</th><th>客户</th><th>产品</th><th>数量</th><th>单价</th><th>交期</th><th>状态</th></tr>"+
      orderRows(orders)+"</table>";
  }else if(all.length){
    /* 有单但被筛没了：必须和「真没单」区分开，否则用户以为数据丢了 */
    box.innerHTML = '<div class="empty-state">'+
      '<div class="es-icon">🔎</div>'+
      '<div class="es-title">当前筛选无匹配订单</div>'+
      '<div class="es-desc">共 '+all.length+' 笔订单，被当前筛选条件全部挡住。</div>'+
      '<div class="es-eg"><button type="button" class="flt-btn" onclick="resetOrderFilter()">重置筛选</button></div>'+
      '</div>';
  }else{
    box.innerHTML = emptyState("📭", "台账还没有订单",
      "客户在「💬 微信沟通」页发来订单消息后，这里会自动生成订单行并持续跟踪变更。",
      "「小陈，法兰 DN80 250 个，28 号前要」");
  }
  applyHit(false);   /* 重渲染后把当前定位高亮补回去，避免刷新就把人看丢了 */
}

/* 高亮：给 HIT_IDS 里的单加上浅蓝底色；scroll=true 时把它滚到可视区中间 */
function applyHit(scroll){
  const box = el("pOrderTable"); if(!box) return;
  box.querySelectorAll("tr.hit").forEach(tr=>tr.classList.remove("hit","flash"));
  void box.offsetHeight;                       /* 强制重排：否则同一帧里重加 flash 动画不重播 */
  let first = null;
  HIT_IDS.forEach(oid=>{
    const tr = box.querySelector(`tr.orow[data-oid="${esc(oid)}"]`);
    if(!tr) return;
    tr.classList.add("hit");
    if(scroll) tr.classList.add("flash");
    if(!first) first = tr;
  });
  if(first && scroll){
    /* 台账在面板内部滚动，scrollIntoView 会连同外层一起调整到居中位置 */
    first.scrollIntoView({ block:"center", behavior:"smooth" });
  }
}

/* 父单小箭头：展开 / 收起该单的变更履历子单 */
function toggleHist(oid){
  if(!oid) return;
  if(histOpen.has(oid)) histOpen.delete(oid); else histOpen.add(oid);
  renderOrderTable();
  if(histOpen.has(oid)){
    const tr = el("pOrderTable").querySelector(`tr.orow[data-oid="${esc(oid)}"]`);
    if(tr) tr.scrollIntoView({ block:"nearest", behavior:"smooth" });
  }
}

function renderPlatform(L){
  if(!L || !L.orders){
    el("pOrderTable").innerHTML = emptyState("🔌", "台账暂未加载",
      "请确认后台服务已启动后刷新页面。");
    el("pTaskTable").innerHTML = "";
    return;
  }
  LAST_LEDGER = L;
  const tasks=L.tasks||[];
  if(el("modeBadge")) el("modeBadge").textContent = L.mode||"";
  el("pTaskCount").textContent = "（"+tasks.length+" 项）";
  /* 订单计数与表格统一走 refreshOrderView：它会带上当前筛选条件，
     并负责写入 pOrderCount（合并后这里曾漏掉，导致标题旁计数一直为空） */
  refreshOrderView();
  el("pTaskTable").innerHTML = tasks.length ? (
    "<table><tr><th>事项</th><th>责任人</th><th>期限</th><th>状态</th></tr>"+
    taskRows(tasks)+"</table>") : emptyState("🗂️", "台账还没有任务",
      "瓯单通会从群聊里自动识别待办，指派负责人和期限，并跟着订单一起留痕。",
      "「小周，周五前把样品寄给王总」→ 自动记一条待办");
  renderStats(L);
}
function renderStats(L){
  const orders=L.orders||[], tasks=L.tasks||[];
  const inProg = orders.filter(o=>!["已交付","已取消"].includes(o.status)).length;
  const delivered = orders.filter(o=>o.status==="已交付").length;
  const cancelled = orders.filter(o=>o.status==="已取消").length;
  const data = [
    {n:orders.length, t:"订单总数"}, {n:inProg, t:"在途"},
    {n:delivered, t:"已交付"}, {n:cancelled, t:"已取消"}, {n:tasks.length, t:"任务总数"},
  ];
  el("stats").innerHTML = data.map(d=>`<div class="stat"><div class="n">${d.n}</div><div class="t">${d.t}</div></div>`).join("");
}

/* ================= 订单台账 · 四维筛选 =================
   维度：状态（多选）/ 交期（单选）/ 客户（多选）/ 单号（子串输入）。
   同维多值取并集，维与维之间取交集；空集合或空串表示该维不限。
   判定函数（effectiveDue / dueBucket / matchOrder / filterOrders / activeDims）不碰 DOM，
   便于脱离浏览器做表驱动测试——筛选的边界最容易「看着对、实际差一天」。 */
/* custKeyword 是「客户搜索框里正在输入的关键字」，**不是筛选维度**：
   它只影响候选列表显示什么，不参与 matchOrder、不计入 activeDims、不改表格 */
const ORDER_FILTER = { status: new Set(), due: "", customers: new Set(), oid: "", custKeyword: "" };

/* 与 contracts.STATUS_ORDER 对齐，顺序即业务流转顺序 */
const FILTER_STATUSES = ["沟通中", "已确认", "生产中", "部分交付", "已交付", "已取消"];
const DUE_OPTIONS = [
  { v: "",        t: "全部" },
  { v: "overdue", t: "已逾期" },
  { v: "d7",      t: "7 天内" },
  { v: "d30",     t: "30 天内" },
  { v: "none",    t: "未填交期" },
];
const CUST_VISIBLE = 5;   /* 客户超过 5 个，其余收进「更多 ▸」二级菜单 */

/* 取本地「今天 00:00」，不用 UTC —— 否则东八区早上 8 点前会整体差一天 */
function filterToday(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function parseYmd(s){
  if(!s || typeof s !== "string") return null;
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s.trim());
  if(!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return isNaN(d.getTime()) ? null : d;
}

/* 有效交期：与 contracts.effective_delivery_date 同口径——分批单取「最晚批次日」，
   无批次才回退单值 delivery_date。台账接口不给算好的有效交期，前端必须自己算，
   否则分批单（delivery_date 常为 null）会被误判成「未填交期」。 */
function effectiveDue(o){
  o = o || {};
  const bs = o.delivery_batches;
  if(Array.isArray(bs) && bs.length){
    let max = null;
    for(let i = 0; i < bs.length; i++){
      const d = parseYmd(bs[i] && bs[i].date);
      if(d && (!max || d > max)) max = d;
    }
    if(max) return max;
  }
  return parseYmd(o.delivery_date);
}

/* 交期档位：overdue | d7 | d30 | later | none
   逾期独占一档，因此不会与「7 天内」重叠 */
function dueBucket(dd, today){
  if(!dd) return "none";
  const t = today || filterToday();
  const diff = Math.round((dd.getTime() - t.getTime()) / 86400000);
  if(diff < 0) return "overdue";
  if(diff <= 7) return "d7";
  if(diff <= 30) return "d30";
  return "later";
}

function matchOrder(o, f, today){
  f = f || ORDER_FILTER; o = o || {};
  if(f.status && f.status.size && !f.status.has(o.status)) return false;
  if(f.customers && f.customers.size && !f.customers.has(o.customer)) return false;
  if(f.oid && String(f.oid).trim()){
    const key = String(f.oid).trim().toLowerCase();
    if(String(o.order_id || "").toLowerCase().indexOf(key) < 0) return false;
  }
  if(f.due){
    const b = dueBucket(effectiveDue(o), today);
    if(f.due === "none" ? b !== "none" : b !== f.due) return false;
  }
  return true;
}
function filterOrders(list, f, today){
  return (list || []).filter(function(o){ return matchOrder(o, f, today); });
}
/* 已生效「维度」数（0~4），用于按钮徽标；按维度算，不按勾选个数算 */
function activeDims(f){
  f = f || ORDER_FILTER;
  let n = 0;
  if(f.status && f.status.size) n++;
  if(f.due) n++;
  if(f.customers && f.customers.size) n++;
  if(f.oid && String(f.oid).trim()) n++;
  return n;
}

/* ---------- 筛选器 UI（菜单挂 body：.panel 是 overflow:hidden，子元素会被裁掉） ---------- */
let FLT_MENU = null, FLT_SUB = null;
let FLT_CUST_HI = -1;   /* 客户候选里键盘高亮的下标；-1 = 无高亮 */

function escAttr(s){ return esc(s).replace(/"/g, "&quot;"); }

/* 客户按出现次数降序；次数相同按名称排，保证每次打开顺序稳定 */
function filterCustomers(){
  const list = (LAST_LEDGER && LAST_LEDGER.orders) || [];
  const cnt = new Map();
  list.forEach(function(o){
    const c = o && o.customer;
    if(c) cnt.set(c, (cnt.get(c) || 0) + 1);
  });
  return Array.from(cnt.entries())
    .sort(function(a, b){ return b[1] - a[1] || a[0].localeCompare(b[0], "zh"); })
    .map(function(e){ return e[0]; });
}

/* 子串匹配客户全名，不区分大小写；空关键字视为「不过滤」。
   例：「永嘉」命中「王总（永嘉精密机械）」，「王总」同样命中 */
function custMatches(name, kw){
  const k = String(kw == null ? "" : kw).trim().toLowerCase();
  if(!k) return true;
  return String(name == null ? "" : name).toLowerCase().indexOf(k) >= 0;
}

/* 候选分区（纯函数，便于表驱动测试）：
   - 关键字为空 → 前 CUST_VISIBLE 个直接列出，其余进「更多 ▸」（保留原分页语义）
   - 关键字非空 → 全量命中、不分页（搜索本身就在缩小范围，再分页反而碍事）
   list 参数仅用于测试注入；不传则回退到 filterCustomers()。 */
function custCandPlan(kw, list){
  const all = list || filterCustomers();
  const k = String(kw == null ? "" : kw).trim();
  if(!k) return { searching: false, main: all.slice(0, CUST_VISIBLE), rest: all.slice(CUST_VISIBLE) };
  return { searching: true, main: all.filter(function(c){ return custMatches(c, k); }), rest: [] };
}

/* opts 用于把候选行渲染成 listbox 里的 option（role/aria 与菜单项不同）：
   { role:"option", id:"fltCand-2", cand:true } */
function filterOptRow(kind, val, label, multi, opts){
  opts = opts || {};
  const role = opts.role || (multi ? "menuitemcheckbox" : "menuitemradio");
  const idAttr = opts.id ? ' id="' + escAttr(opts.id) + '"' : "";
  const candAttr = opts.cand ? ' data-cand="1"' : "";
  const ariaAttr = opts.cand ? ' aria-selected="false"' : ' aria-checked="false"';
  return '<button type="button" class="flt-opt" role="' + role + '"' + idAttr + ariaAttr + candAttr +
    ' data-kind="' + kind + '" data-v="' + escAttr(val) +
    '" data-multi="' + (multi ? 1 : 0) + '" title="' + escAttr(label) + '">' +
    '<span class="mk"></span><span class="lb">' + esc(label) + '</span></button>';
}

function renderFilterMenu(){
  const custs = filterCustomers();
  const plan = custCandPlan(ORDER_FILTER.custKeyword || "", custs);

  /* 两列：左列状态+交期，右列客户+单号，重置跨列置底（两列高度天然不等，置底更稳） */
  FLT_MENU.innerHTML =
    '<div class="flt-cols">' +

      '<div class="flt-col">' +
        '<div class="flt-title">状态</div>' +
        FILTER_STATUSES.map(function(s){ return filterOptRow("status", s, s, true); }).join("") +
        '<div class="flt-sep"></div><div class="flt-title">交期</div>' +
        DUE_OPTIONS.map(function(d){ return filterOptRow("due", d.v, d.t, false); }).join("") +
      '</div>' +

      '<div class="flt-col">' +
        '<div class="flt-title">客户</div>' +
        /* tag 与 input 同处一个 .flt-combo；候选列表在 combo 之外，
           所以重写候选不会影响输入框焦点 */
        '<div class="flt-combo" id="fltCustCombo">' +
          '<span id="fltCustTags"></span>' +
          '<input id="fltCustSearch" type="text" autocomplete="off" spellcheck="false" ' +
          'role="combobox" aria-expanded="true" aria-autocomplete="list" aria-controls="fltCustCand" ' +
          'aria-label="搜索客户" placeholder="搜索客户…" ' +
          'value="' + escAttr(ORDER_FILTER.custKeyword || "") + '">' +
        '</div>' +
        '<div class="flt-cand" id="fltCustCand" role="listbox" ' +
        'aria-label="客户候选" aria-multiselectable="true"></div>' +
        /* 「更多」只按 rest 生成一次；后续 renderCustCand 只切 hidden，不销毁节点 */
        (plan.rest.length
          ? '<button type="button" class="flt-opt" id="fltCustMore" data-sub="customer" ' +
            'role="menuitem" aria-haspopup="true">' +
            '<span class="mk"></span><span class="lb">更多</span><span class="arw">▸</span></button>'
          : "") +
        '<div class="flt-sep"></div><div class="flt-title">单号</div>' +
        '<input class="flt-input" id="fltOid" type="text" autocomplete="off" ' +
        'placeholder="输入单号片段，如 20261024-0" value="' + escAttr(ORDER_FILTER.oid || "") + '">' +
      '</div>' +

    '</div>' +

    '<div class="flt-sep"></div>' +
    '<button type="button" class="flt-opt flt-reset" data-kind="reset" role="menuitem">' +
    '<span class="mk"></span><span class="lb">重置筛选</span></button>';

  FLT_SUB.innerHTML = plan.rest.length
    ? '<div class="flt-title">更多客户</div>' +
      plan.rest.map(function(c){ return filterOptRow("customer", c, c, true); }).join("")
    : "";
  FLT_SUB.hidden = true;
  renderCustTags();
  renderCustCand();
  syncFilterMarks();
}

/* 已选客户 → tag（只重写 #fltCustTags，不碰 candidates，避免打断输入焦点）。
   不跟台账做交集：客户可能已被删单，但筛选还在用它，净化会让 tag 与结果对不上。 */
function renderCustTags(){
  const box = el("fltCustTags"); if(!box) return;
  box.innerHTML = Array.from(ORDER_FILTER.customers).map(function(c){
    const a = escAttr(c);
    return '<span class="flt-tag" title="' + a + '">' +
      '<span class="tx">' + esc(c) + '</span>' +
      '<button type="button" class="x" data-deltag="' + a + '" ' +
      'aria-label="移除 ' + a + '" title="移除">×</button></span>';
  }).join("");
}

/* 候选列表：只由关键字决定（选中态由 syncFilterMarks 写 ✓，不参与 HTML 生成） */
function renderCustCand(){
  const box = el("fltCustCand"); if(!box) return;
  const kw = ORDER_FILTER.custKeyword || "";
  const plan = custCandPlan(kw);
  if(plan.searching) closeFilterSub();          /* 搜索态不保留二级菜单，避免两份列表抢视线 */

  const more = el("fltCustMore");
  if(more) more.hidden = plan.searching || !plan.rest.length;

  if(plan.main.length){
    box.innerHTML = plan.main.map(function(c, i){
      return filterOptRow("customer", c, c, true, { role: "option", id: "fltCand-" + i, cand: true });
    }).join("");
  }else{
    /* 两种空态必须分开：台账真没客户 vs 关键字搜不到 */
    box.innerHTML = '<div class="flt-cand-empty" role="status">' +
      (plan.searching ? "无匹配「" + esc(kw.trim()) + "」" : "台账暂无客户") + '</div>';
  }

  const inp = el("fltCustSearch");
  if(inp) inp.setAttribute("aria-expanded", plan.main.length ? "true" : "false");
  FLT_CUST_HI = -1;
  syncFilterMarks();
}

function syncFilterMarks(){
  [FLT_MENU, FLT_SUB].forEach(function(root){
    if(!root) return;
    root.querySelectorAll(".flt-opt[data-kind]").forEach(function(o){
      const k = o.dataset.kind, v = o.dataset.v;
      let on = false;
      if(k === "status") on = ORDER_FILTER.status.has(v);
      else if(k === "customer") on = ORDER_FILTER.customers.has(v);
      else if(k === "due") on = (ORDER_FILTER.due || "") === v;
      /* 候选行是 listbox 里的 option，语义上只有 aria-selected，没有 aria-checked */
      o.setAttribute(o.dataset.cand === "1" ? "aria-selected" : "aria-checked", on ? "true" : "false");
      const mk = o.querySelector(".mk");
      if(mk) mk.textContent = on ? (o.dataset.multi === "1" ? "✓" : "•") : "";
    });
  });
}

function placeFilterMenu(){
  if(!FLT_MENU || FLT_MENU.hidden) return;
  const btn = el("ordFilterBtn"); if(!btn) return;
  const r = btn.getBoundingClientRect();
  FLT_MENU.style.visibility = "hidden";
  const mw = FLT_MENU.offsetWidth, mh = FLT_MENU.offsetHeight;
  let left = r.right - mw;
  if(left < 8) left = 8;
  if(left + mw > window.innerWidth - 8) left = window.innerWidth - mw - 8;
  let top = r.bottom + 6;
  if(top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);   /* 下方不够就向上翻 */
  FLT_MENU.style.left = Math.round(left) + "px";
  FLT_MENU.style.top = Math.round(top) + "px";
  FLT_MENU.style.visibility = "";
}

function closeFilterSub(){ if(FLT_SUB) FLT_SUB.hidden = true; }

function openFilterMenu(){
  ensureFilterMenu();
  renderFilterMenu();
  FLT_MENU.hidden = false;
  placeFilterMenu();
  const btn = el("ordFilterBtn");
  if(btn) btn.setAttribute("aria-expanded", "true");
}
function closeFilterMenu(){
  if(FLT_MENU) FLT_MENU.hidden = true;
  closeFilterSub();
  /* 关键字是瞬态 UI，不是筛选维度：关掉菜单就清，否则重开时会出现
     「输入框是空的、候选却被过滤了」的鬼状态 */
  ORDER_FILTER.custKeyword = "";
  FLT_CUST_HI = -1;
  const s = el("fltCustSearch"); if(s) s.value = "";
  const btn = el("ordFilterBtn");
  if(btn) btn.setAttribute("aria-expanded", "false");
}

function toggleFilterSub(btn){
  if(!FLT_SUB || !FLT_SUB.innerHTML) return;
  if(!FLT_SUB.hidden){ closeFilterSub(); return; }
  FLT_SUB.hidden = false;
  const r = btn.getBoundingClientRect();
  const w = FLT_SUB.offsetWidth, h = FLT_SUB.offsetHeight;
  let left = r.right - 2;
  if(left + w > window.innerWidth - 8) left = Math.max(8, r.left - w + 2);
  let top = r.top - 6;
  if(top + h > window.innerHeight - 8) top = Math.max(8, window.innerHeight - h - 8);
  FLT_SUB.style.left = Math.round(left) + "px";
  FLT_SUB.style.top = Math.round(top) + "px";
  syncFilterMarks();
}

/* 把焦点还给客户搜索框，光标置于末尾（仅在确实丢了焦点时调） */
function focusCustInput(){
  const inp = el("fltCustSearch"); if(!inp) return;
  if(document.activeElement === inp) return;
  inp.focus();
  const n = inp.value.length;
  if(inp.setSelectionRange) inp.setSelectionRange(n, n);
}

/* 客户勾选/取消。
   注意：这里**不能重建候选列表**（renderCustCand）。候选 HTML 只由关键字决定，
   选中态由 syncFilterMarks 写 ✓ 就行；一旦重建，刚被点击的那个 button 会被摘出 DOM，
   冒泡到 document 时 FLT_MENU.contains(e.target) 变 false，菜单会被「点外部」逻辑关掉。 */
function toggleCustomer(v){
  if(!v) return;
  ORDER_FILTER.customers.has(v) ? ORDER_FILTER.customers.delete(v) : ORDER_FILTER.customers.add(v);
  renderCustTags();
  syncFilterMarks();
  refreshOrderView();
}

function onFilterMenuClick(e){
  /* tag 上的 × 删除：不在 .flt-opt 里，必须单独判，且要排在 .flt-opt 之前 */
  const del = e.target.closest ? e.target.closest("[data-deltag]") : null;
  if(del){
    const dv = del.getAttribute("data-deltag");
    if(dv){
      ORDER_FILTER.customers.delete(dv);
      renderCustTags();
      syncFilterMarks();
      refreshOrderView();
      focusCustInput();
    }
    return;
  }
  const more = e.target.closest ? e.target.closest("[data-sub]") : null;
  if(more){ toggleFilterSub(more); return; }
  const opt = e.target.closest ? e.target.closest(".flt-opt") : null;
  if(!opt) return;
  const kind = opt.dataset.kind, v = opt.dataset.v;
  if(kind === "reset"){ resetOrderFilter(); return; }
  if(kind === "status"){
    ORDER_FILTER.status.has(v) ? ORDER_FILTER.status.delete(v) : ORDER_FILTER.status.add(v);
  }else if(kind === "customer"){
    toggleCustomer(v);
    return;
  }else if(kind === "due"){
    ORDER_FILTER.due = v || "";
  }else{
    return;
  }
  syncFilterMarks();
  refreshOrderView();
}

function ensureFilterMenu(){
  if(FLT_MENU) return FLT_MENU;
  FLT_MENU = document.createElement("div");
  FLT_MENU.className = "flt-menu";
  FLT_MENU.id = "ordFilterMenu";
  FLT_MENU.hidden = true;
  FLT_MENU.setAttribute("role", "menu");
  document.body.appendChild(FLT_MENU);

  FLT_SUB = document.createElement("div");
  FLT_SUB.className = "flt-sub";
  FLT_SUB.id = "ordFltSub";
  FLT_SUB.hidden = true;
  document.body.appendChild(FLT_SUB);

  FLT_MENU.addEventListener("click", onFilterMenuClick);
  FLT_SUB.addEventListener("click", onFilterMenuClick);

  /* 单号 → 即时筛选；客户关键字 → 只重绘候选。
     客户搜索**不能**调 refreshOrderView：关键字不是筛选维度，
     每敲一个字符重绘表格（含强制重排 + 高亮补回）纯属浪费还会闪。 */
  FLT_MENU.addEventListener("input", function(e){
    if(!e.target) return;
    if(e.target.id === "fltOid"){
      ORDER_FILTER.oid = e.target.value;
      refreshOrderView();
    }else if(e.target.id === "fltCustSearch"){
      if(e.isComposing) return;          /* 拼音组合中不筛，避免中途一路闪「无匹配」 */
      ORDER_FILTER.custKeyword = e.target.value;
      renderCustCand();
    }
  });
  FLT_MENU.addEventListener("compositionend", function(e){
    if(e.target && e.target.id === "fltCustSearch"){
      ORDER_FILTER.custKeyword = e.target.value;
      renderCustCand();
    }
  });
  FLT_MENU.addEventListener("keydown", onCustKeydown);
  /* capture 阶段抢在浏览器默认聚焦之前：删 tag 时焦点不离开输入框 */
  FLT_MENU.addEventListener("mousedown", onFilterMenuMousedown, true);

  return FLT_MENU;
}

/* ---------- 客户搜索框的键盘与鼠标 ---------- */

/* 高亮下标推进（纯函数，便于表驱动测试）。
   无高亮（-1）时：↓ 从第 0 项开始，↑ 从最后一项开始 */
function nextCustHi(cur, delta, len){
  if(len <= 0) return -1;
  if(cur < 0) return delta > 0 ? 0 : len - 1;
  let i = cur + delta;
  if(i < 0) i = 0;
  if(i > len - 1) i = len - 1;
  return i;
}

function custCandRows(){
  const box = el("fltCustCand");
  if(!box || !box.querySelectorAll) return [];
  return Array.prototype.slice.call(box.querySelectorAll(".flt-opt"));
}

function scrollCustHi(){
  const box = el("fltCustCand"), rows = custCandRows();
  const row = rows[FLT_CUST_HI];
  if(!box || !row) return;
  /* 手算滚位，不用 scrollIntoView —— 祖先链上有 position:fixed，
     它可能把 document 也滚一下 */
  const top = row.offsetTop, bot = top + row.offsetHeight;
  if(top < box.scrollTop) box.scrollTop = top;
  else if(bot > box.scrollTop + box.clientHeight) box.scrollTop = bot - box.clientHeight;
}

function moveCustHi(delta){
  const rows = custCandRows();
  FLT_CUST_HI = nextCustHi(FLT_CUST_HI, delta, rows.length);
  rows.forEach(function(r, i){ r.classList.toggle("hi", i === FLT_CUST_HI); });
  const inp = el("fltCustSearch");
  if(inp){
    const cur = rows[FLT_CUST_HI];
    if(cur && cur.id) inp.setAttribute("aria-activedescendant", cur.id);
    else inp.removeAttribute("aria-activedescendant");
  }
  scrollCustHi();
}

function pickCustHi(){
  const rows = custCandRows();
  if(!rows.length) return;
  const row = rows[FLT_CUST_HI] || rows[0];
  const v = row && row.dataset ? row.dataset.v : "";
  if(!v) return;
  toggleCustomer(v);
  focusCustInput();
}

function onCustKeydown(e){
  if(!e.target || e.target.id !== "fltCustSearch") return;
  if(e.isComposing || e.keyCode === 229) return;     /* 输入法上屏的 Enter 不能当「选中」 */

  if(e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    moveCustHi(e.key === "ArrowDown" ? 1 : -1);
    return;
  }
  if(e.key === "Enter"){
    e.preventDefault();
    pickCustHi();
    return;
  }
  /* 输入框为空时退格 = 删最后一个 tag。value 非空一律放行给浏览器原生删除 */
  if(e.key === "Backspace" && !e.target.value && ORDER_FILTER.customers.size){
    e.preventDefault();
    const arr = Array.from(ORDER_FILTER.customers);
    ORDER_FILTER.customers.delete(arr[arr.length - 1]);
    renderCustTags();
    syncFilterMarks();
    refreshOrderView();
  }
}

function onFilterMenuMousedown(e){
  const t = e.target;
  if(!t || !t.closest) return;
  if(t.closest("[data-deltag]")){ e.preventDefault(); return; }
  const combo = t.closest(".flt-combo");
  if(!combo) return;
  /* 点在 input 本身：放行，让浏览器原生定位光标（强行 focus 会把光标推到末尾）
     点在死区（tag 之间、换行后空白、tag 文字）：拦掉默认行为，光标放末尾 */
  if(t === combo || t.closest(".flt-tag")){
    e.preventDefault();
    focusCustInput();
  }
}

function resetOrderFilter(opts){
  ORDER_FILTER.status.clear();
  ORDER_FILTER.customers.clear();
  ORDER_FILTER.due = "";
  ORDER_FILTER.oid = "";
  ORDER_FILTER.custKeyword = "";
  FLT_CUST_HI = -1;
  const inp = el("fltOid"); if(inp) inp.value = "";
  const cs = el("fltCustSearch"); if(cs) cs.value = "";
  /* 菜单可能压根没创建过（ensureVisible / resetAll 会在无 UI 时调到这里），
     两个渲染函数都按节点判空，安全 */
  renderCustTags();
  renderCustCand();
  syncFilterMarks();
  refreshOrderView();
  if(!(opts && opts.silent)) toast("🧹 已重置筛选条件");
}

/* 唯一渲染出口：算筛选结果 → 更新计数与徽标 → 重绘表格。
   所有会改变台账或筛选的路径都走这里，避免「有的地方筛、有的地方不筛」。 */
function refreshOrderView(){
  const all = (LAST_LEDGER && LAST_LEDGER.orders) || [];
  const shown = filterOrders(all, ORDER_FILTER);
  const dims = activeDims(ORDER_FILTER);
  const cnt = el("pOrderCount");
  if(cnt) cnt.textContent = dims ? "（" + shown.length + " / " + all.length + " 笔）"
                                 : "（" + all.length + " 笔）";
  renderOrderTable(shown);
  const badge = el("ordFilterBadge");
  if(badge){ badge.hidden = !dims; badge.textContent = String(dims); }
}

/* 查询命中被筛选挡住时，先清筛选再跳转 —— 绝不让高亮静默失效
   opts.quiet：不自己弹 toast，把提示交由调用方合并（toast 是单槽，否则必被覆盖） */
function ensureVisible(ids, opts){
  if(!ids || !ids.length) return false;
  const all = (LAST_LEDGER && LAST_LEDGER.orders) || [];
  const shown = new Set(filterOrders(all, ORDER_FILTER).map(function(o){ return o.order_id; }));
  const hidden = ids.filter(function(id){ return !shown.has(id); });
  if(!hidden.length) return false;
  resetOrderFilter({ silent: true });
  if(!(opts && opts.quiet)) toast("🔎 已清空筛选，以显示查询命中的订单");
  return true;
}

/* 进入平台页 / 初始化 / 重置后都会调用：拉取台账并渲染 */
async function refreshPlatform(){
  try{
    const L = await apiGet("/api/ledger");
    renderPlatform(L);
  }catch(e){ showErr("加载台账失败："+e.message); }
}

/* ---------- 平台：查询 / 简报 / 重置 ---------- */
/* 查询反馈三条路（用户 2026-10-23 定稿）：
   ① 命中订单 → 查询区不出任何结果栏，直接跳到「📦 订单台账」那一笔并浅蓝高亮；
   ② 问的是简报 → 落到「📊 今日简报」面板，不占查询区；
   ③ 没法用高亮表达的（多单待澄清 / 无命中 / 解析入库回执）→ 才在查询区下浮一行提示。 */
function note(text, tone){
  const n = el("qNote"); if(!n) return;
  if(!text){ n.className = "q-note"; n.textContent = ""; return; }
  n.className = "q-note show" + (tone ? " " + tone : "");
  n.textContent = text;
}
let toastTimer = null;
function toast(html){
  let t = el("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.innerHTML = html;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2800);
}

/* 把查询结果落到台账上：定位 + 高亮 +（履历查询时）自动展开子单 */
function applyQuery(data){
  const f = (data && data.focus) || {};
  const ids = Array.isArray(f.order_ids) ? f.order_ids.slice() : [];
  const kind = f.kind || "";
  /* 命中单若被当前筛选挡住，先清筛选再跳转，否则高亮会静默消失。
     toast 是单槽（后写覆盖前写），所以这里静默清筛选，把提示合并进下方各自的 toast */
  const flushed = ids.length && (kind === "orders" || kind === "history" || kind === "clarify")
    ? ensureVisible(ids, { quiet:true }) : false;
  const tip = flushed ? "🧹 已清空筛选 · " : "";

  if(data.mode === "briefing" || kind === "briefing"){
    renderBriefing(el("briefResult"), stripNote(data.reply||"（无结果）"));
    toast("📊 简报已生成 → 右下方「今日简报」");
    return;
  }
  if((kind === "orders" || kind === "history") && ids.length){
    HIT_IDS = ids;
    if(kind === "history") ids.forEach(id=>histOpen.add(id));   /* 履历查询：连子单一起展开 */
    renderOrderTable();
    applyHit(true);
    toast(tip + (kind === "history"
      ? `📜 已定位 <span class="tk">${esc(ids[0])}</span> 并展开变更履历（子单）`
      : ids.length > 1
        ? `🔍 命中 <span class="tk">${ids.length}</span> 笔，已在台账中高亮`
        : `🔍 已定位 <span class="tk">${esc(ids[0])}</span>，台账中浅蓝高亮`));
    return;
  }
  if(kind === "clarify" && ids.length){
    HIT_IDS = ids;
    renderOrderTable(); applyHit(true);
    note(stripNote(data.reply||""), "info");
    toast(tip + `🤔 ${ids.length} 笔都匹配，请补充产品名或单号`);
    return;
  }
  if(kind === "fallback"){
    /* 未精确命中：后端不再回传单号，这里直接按台账把「在途单」全点亮，
       用户一眼看到的是"我手上还有这几单"，而不是一段文字列表 */
    const all = ((LAST_LEDGER && LAST_LEDGER.orders) || [])
      .filter(o=>!["已交付","已取消"].includes(o.status))
      .map(o=>o.order_id);
    if(all.length){
      HIT_IDS = all;
      /* 文案说的是「全部在途单」，就必须真让它们全部可见 */
      const f2 = ensureVisible(all, { quiet:true });
      renderOrderTable(); applyHit(true);
      note((f2 ? "（已清空筛选以显示全部在途单）" : "") +
        "未精确命中，已在台账高亮全部在途单（"+all.length+" 笔）。换个称呼或按产品问更准，如「法兰那单到哪了」。", "info");
      return;
    }
    note(stripNote(data.reply||"（无结果）"));
    return;
  }
  /* 无单可定位（解析入库回执 / 闲聊提示 / 台账为空）：如实把文本放出来，绝不静默 */
  note(stripNote(data.reply||"（无结果）"));
}

async function doQuery(){
  const inp = el("qInput");
  if(!inp) return;
  const t = inp.value.trim();
  // 旧版这里 if(!t) return 静默退出 —— 用户点「查询」什么都没发生，观感就是"按钮坏了"。
  if(!t){
    note("请先输入要查的内容，或点下方示例。例如：「法兰那单到哪了？」", "info");
    inp.focus();
    return;
  }
  note("");
  const btn = document.querySelector(".query-box button");
  if(btn) btn.disabled = true;
  toast("⏳ 查询中…");
  try{
    const data = await chatPost({message:t});
    if(data.ledger) renderPlatform(data.ledger);   /* 先刷新台账，保证查到的是最新写入 */
    applyQuery(data);
  }catch(e){
    note("⚠️ 查询失败：" + e.message, "warn");
    toast('<span class="t-warn">⚠️ 查询失败，请重试</span>');
    showErr("查询失败："+e.message);
  }finally{
    if(btn) btn.disabled = false;
  }
}
function qExample(t){
  const inp = el("qInput"); if(!inp) return;
  inp.value = t; doQuery();
}
/* 今日简报结构化渲染：简报文本（模板直出或真实模式 LLM 口语化改写）都是按行组织的，
   逐行解析成「标题行 + 条目（图标 / 名称 / 数量大字 / 补充说明）」的层级——
   各类数量是关键要点，放大高亮；人名、日期、紧急说明下沉为小字说明行，先扫数量再看明细。
   正则匹配不上的行原样保留为普通段落，措辞变化不影响兜底可读。 */
/* 说明行拆条：按顶层「、/；」拆成每条一行——括号（全角/半角/书名号）内的分隔符不拆，
   保证「李姐（凤越五金商贸）」「温州华信电器 还有 12 天（交期 2026-11-05）」这类
   带括号补充的条目完整不被误切。 */
function splitBriefItems(s){
  const out=[]; let buf="", depth=0;
  for(const ch of String(s||"")){
    if("（(「".includes(ch)) depth++;
    else if("）)」".includes(ch)) depth=Math.max(0,depth-1);
    if((ch==="、"||ch==="；") && depth===0){ out.push(buf); buf=""; }
    else buf+=ch;
  }
  if(buf.trim()) out.push(buf);
  return out.map(x=>x.trim()).filter(Boolean);
}
/* 简报行 → 订单匹配：先按单号，再按客户名匹配。数据取自 LAST_LEDGER，
   简报措辞被真实模式 LLM 改写也不影响匹配。
   ⚠️ 同名不同人（如「王总」与「王总（永嘉精密机械）」）不能互串：
   精确匹配优先；否则按「左右前缀」定向匹配，绝不用子串互相包含——
   保证点「王总」只命中真·王总，不会误并到带括号的那位、导致产品回填串数据。 */
function findOrdersByText(t){
  const os = (LAST_LEDGER && LAST_LEDGER.orders) || [];
  t = String(t||"").trim();
  if(!t || !os.length) return [];
  const up = t.toUpperCase();
  const byId = os.filter(o=>o.order_id && up.includes(String(o.order_id).toUpperCase()));
  if(byId.length) return byId;
  const cs = [...new Set(os.map(o=>o.customer).filter(Boolean))];
  const exact = os.filter(o=>o.customer === t);     /* 精确：同名不串 */
  if(exact.length) return exact;
  const pre = cs.filter(c=>t.startsWith(c));          /* 简报名是数据名的超集（如「温州华信电器 …」） */
  if(pre.length) return os.filter(o=>pre.includes(o.customer));
  const suf = cs.filter(c=>c.startsWith(t));          /* 数据名是简报名的超集（如「王总（…）」比「王总」长） */
  if(suf.length) return os.filter(o=>suf.includes(o.customer));
  return [];
}
/* 客户行 → 产品名（新增订单的产品列用；取该客户最近一单的产品） */
function productFor(t){
  const os = findOrdersByText(t);
  return os.length ? (os[0].product || "—") : "—";
}
/* 剩余天数：date 距今天的天数（负=已逾期），非法日期返回 null */
function daysUntil(d){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d||""))) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((new Date(d) - today) / 86400000);
}
/* 把简报里「客户 (+剩余天数) (+交期日期)」的一行文本，拆成 {客户, 交期} 两列内容。
   交期统一输出「还有XX天（交期 yyyy-mm-dd）」；无日期则「待定交期」。 */
function parseCustDue(text){
  text = String(text||"").trim();
  const dm = text.match(/(\d{4}-\d{2}-\d{2})/);
  const date = dm ? dm[1] : null;
  let cust = text
    .replace(/\s*[（(]\s*交期\s*\d{4}-\d{2}-\d{2}\s*[）)]/, "")
    .replace(/\s*[（(]\s*\d{4}-\d{2}-\d{2}\s*[）)]/, "")
    .replace(/\s*还有\s*-?\d+\s*天/, "")
    .replace(/\s*已逾期\s*-?\d+\s*天/, "")
    .replace(/\s*今天到期/, "")
    .replace(/\s*待定交期/, "")
    .replace(/\s*[：:].*$/, "")
    .replace(/^[^\u4e00-\u9fa5A-Za-z0-9]+/, "")
    .trim();
  if(!cust && date){
    cust = text.replace(date, "").replace(/[（(]\s*交期\s*[）)]/, "")
              .replace(/[（）()]/g, "").replace(/[：:].*$/, "").trim() || "—";
  }
  let due;
  if(date){
    const d = daysUntil(date);
    due = d === null ? `交期 ${date}`
      : d < 0 ? `已逾期${-d}天（交期 ${date}）`
      : d === 0 ? `今天到期（交期 ${date}）`
      : `还有${d}天（交期 ${date}）`;
  } else {
    due = "待定交期";
  }
  return { cust: cust || "—", due };
}
/* 沟通中兜底：直接从台账取全部「沟通中」订单生成明细，保证一行不落。
   简报文本被真实模式 LLM 压缩成「最急：…」或条数对不上时，用它整体替换。 */
function pendingFromLedger(){
  const os = (LAST_LEDGER && LAST_LEDGER.orders) || [];
  return os.filter(o=>String(o.status||"").includes("沟通中")).map(o=>{
    const d = daysUntil(o.delivery_date);
    const tag = d === null ? "待定交期"
      : d < 0 ? `已逾期 ${-d} 天`
      : d === 0 ? "今天到期"
      : `还有 ${d} 天`;
    return `${o.customer} ${tag}${o.delivery_date ? `（交期 ${o.delivery_date}）` : ""}`;
  });
}
/* 点击简报行：把关联订单写进 HIT_IDS → 台账重渲染 → 加深底色并滚动到可视区。
   若点击的是「无」（无对应订单），则取消订单台账的全部背景加深效果。 */
function briefHit(texts){
  const ids = [];
  (texts||[]).forEach(t=>{
    if(String(t||"").trim() === "无") return;          /* 无 → 不定位 */
    findOrdersByText(t).forEach(o=>{
      if(o.order_id && !ids.includes(o.order_id)) ids.push(o.order_id);
    });
  });
  if(!ids.length){
    if(HIT_IDS.length){                                  /* 原来有高亮 → 全部取消 */
      HIT_IDS = [];
      renderOrderTable(); applyHit(false);
      toast("已取消订单台账的高亮");
    } else {
      toast("这一行没有匹配到台账订单");
    }
    return;
  }
  HIT_IDS = ids;
  /* 目标单可能正被筛选挡住：先清筛选再定位，否则 applyHit 找不到 <tr>，高亮静默失效。
     注意只在「有命中」这一支做——上面的「点『无』取消高亮」绝不能动用户的筛选条件 */
  const flushed = ensureVisible(ids, { quiet:true });
  renderOrderTable(); applyHit(true);
  toast((flushed ? "🧹 已清空筛选 · " : "") + `📍 已在订单台账定位 ${ids.length} 笔关联订单`);
}
/* 点击简报行：直接在「订单台账」页面内定位并加深对应订单的背景（不新开弹窗/窗口）。 */
function renderBriefing(out, text){
  if(!out) return;
  text = (text||"").trim();
  if(!text){ out.textContent = ""; return; }
  const lines = text.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const RE = /^(.*?)[：:]\s*(\d+)\s*(笔|项)\s*(?:[（(](.*)[）)])?\s*$/;
  const leadSym = /^([^\u4e00-\u9fa5A-Za-z0-9]+)(.*)$/;   /* 抓行首 emoji/符号 */
  let head = "", body = "";
  lines.forEach((ln,i)=>{
    const m = ln.match(RE);
    if(m){
      const em = (m[1]||"").match(leadSym);
      const ico = em ? em[1].trim() : "";
      const label = (em ? em[2] : m[1]||"").trim() || "条目";
      /* 三类明细布局：新增订单→客户|产品；沟通中/临期交付→客户|交期；其余→纯文本 */
      const isNew = /新增/.test(label);
      const isCustDue = /沟通中/.test(label) || /临期/.test(label);
      let items = m[4] ? splitBriefItems(m[4]) : [];
      /* 沟通中：显示不全就整体用台账数据补全（真实模式 LLM 常把明细压成「最急：…」一条） */
      if(/沟通中/.test(label)){
        const fromLedger = pendingFromLedger();
        const shown = items.filter(it=>it && it !== "无");
        if(fromLedger.length && (shown.length !== fromLedger.length || /最急/.test(items.join("；")))){
          items = fromLedger;
        }
        /* 沟通中为空（0 笔 / 值为「无」）→ 取消订单台账的全部高亮 */
        if(m[2] === "0" || !items.length || (items.length === 1 && items[0] === "无")){
          HIT_IDS = []; applyHit(false);
        }
      }
      const hasRows = items.some(it=>it && it !== "无");
      let pairHead = "", subs;
      if(isCustDue){
        /* 客户 | 交期 双列，交期统一「还有XX天（交期 yyyy-mm-dd）」 */
        pairHead = hasRows ? `<div class="brief-duo-head"><span>客户</span><span>交期</span></div>` : "";
        subs = items.map(it=>{
          if(it === "无") return `<div class="brief-sub">无</div>`;
          const cd = parseCustDue(it);
          return `<div class="brief-duo">`+
            `<div class="brief-cust" data-cust="${esc(cd.cust)}">${esc(cd.cust)}</div>`+
            `<div class="brief-due">${esc(cd.due)}</div></div>`;
        }).join("");
      } else if(isNew){
        /* 客户 | 产品 双列（产品由台账按客户匹配补出） */
        pairHead = hasRows ? `<div class="brief-pair-head"><span>客户</span><span>产品</span></div>` : "";
        subs = items.map(it=>{
          if(it === "无") return `<div class="brief-sub">无</div>`;
          return `<div class="brief-pair">`+
            `<div class="brief-sub">${esc(it)}</div>`+
            `<div class="brief-sub brief-prod">${esc(productFor(it))}</div></div>`;
        }).join("");
      } else {
        subs = items.map(it=>`<div class="brief-sub">${esc(it)}</div>`).join("");
      }
      body += `<div class="brief-item"><div class="brief-line">`+
        (ico ? `<span class="brief-ico">${esc(ico)}</span>` : "")+
        `<span class="brief-label">${esc(label)}</span>`+
        `<b class="brief-num">${esc(m[2])}</b><span class="brief-unit">${esc(m[3])}</span></div>`+
        pairHead+subs+`</div>`;
    }else if(i === 0 && /简报/.test(ln)){
      const em = ln.match(leadSym);
      head = `<div class="brief-head">`+
        (em ? `<span class="brief-ico">${esc(em[1].trim())}</span>` : "")+
        `${esc((em ? em[2] : ln).trim())}</div>`;
    }else{
      body += `<div class="brief-plain">${esc(ln)}</div>`;
    }
  });
  out.innerHTML = head + `<div class="brief">${body}</div>`;
  /* 行点击 → 台账定位高亮（onclick 赋值防重复绑定）：
     双列行整体是一个点击区（点整行任意位置都按客户列定位，不拆客户/产品两个点击点）；
     点条目头高亮该板块全部关联订单 */
  out.onclick = (ev)=>{
    const item = ev.target.closest(".brief-item");
    if(!item) return;
    /* 点 客户|交期 双列行 → 按客户列定位台账 */
    const duo = ev.target.closest(".brief-duo");
    if(duo){ const c = duo.querySelector(".brief-cust"); briefHit([c ? c.textContent : duo.textContent]); return; }
    /* 点 客户|产品 双列行 → 按客户列定位台账 */
    const pair = ev.target.closest(".brief-pair");
    if(pair){ const c = pair.querySelector(".brief-sub:not(.brief-prod)"); briefHit([c ? c.textContent : pair.textContent]); return; }
    /* 点任意明细行（含「无」）→ 按该行文本定位；「无」会触发清除台账高亮 */
    const sub = ev.target.closest(".brief-sub");
    if(sub){ briefHit([sub.textContent]); return; }
    /* 点条目头（如「沟通中 3 笔」）→ 高亮该板块全部关联订单 */
    const subs = [...item.querySelectorAll(".brief-cust,.brief-sub")]
      .map(s=>s.textContent);
    const label = item.querySelector(".brief-label");
    briefHit(subs.length ? subs : (label ? [label.textContent] : []));
  };
}
async function doBriefing(){
  const out = el("briefResult"); if(!out) return;
  out.textContent = "⏳ 正在生成简报…";
  try{
    const data = await chatPost({message:"出今日简报"});
    renderBriefing(out, stripNote(data.reply||"（无结果）"));
  }catch(e){
    out.textContent = "⚠️ 生成简报失败：" + e.message;
    showErr("生成简报失败："+e.message);
  }
}
async function resetAll(){
  try{
    await apiPost("/api/reset");
    if(el("wxChat")) el("wxChat").innerHTML="";
    if(el("briefResult")) el("briefResult").textContent="点击上方按钮生成今日简报。";
    /* 台账清空后旧的定位/展开/筛选状态必须一起清掉，否则会指向不存在的单或筛出空表 */
    HIT_IDS = []; histOpen.clear(); note("");
    resetOrderFilter({ silent:true });   /* 必须在 refreshPlatform 之前：否则首屏会带着旧筛选条件 */
    addWx("agent","台账已清空，可重新模拟客户发消息。","hint");
    await refreshPlatform();
  }catch(e){ showErr("重置失败："+e.message); }
}

/* ---------- 初始化 ---------- */
function renderChatButtons(){
  const box = el("wxActions");
  CHAT_SCENARIOS.forEach(s=>{
    const b=document.createElement("button"); b.className="cbtn"; b.textContent=s.label;
    b.onclick=()=>wxSendScenario(s); box.appendChild(b);
  });
}
/* 台账用事件委托：小箭头是每次重渲染生成的，绑在容器上才不会随 innerHTML 一起失效 */
function bindOrderTable(){
  const box = el("pOrderTable"); if(!box) return;
  box.addEventListener("click", function(ev){
    const btn = ev.target.closest ? ev.target.closest(".hist-toggle") : null;
    if(!btn) return;
    ev.preventDefault();
    toggleHist(btn.dataset.oid);
  });
}
async function init(){
  renderChatButtons();
  bindOrderTable();
  await refreshPlatform();   /* 失败已在内部提示，不阻断欢迎语 */
  addWx("agent","我是瓯单通，已接入本群。客户在微信里发的订单消息，我会自动提取成台账。\n点下方按钮，模拟客户发来 5 类消息 👇","hint");
}
/* Enter 发送 / Shift+Enter 换行。绑定放顶层而非 init() 内：
   init() 是 async 且首行就 await refreshPlatform()，一旦抛错，末尾的绑定会静默丢失。 */
(function bindKeyboard(){
  const wi = el("wxInput");
  bindEnterToSend(wi, wxSendInput);

  /* 查询框单行无换行语义，Enter / Shift+Enter 都触发查询。
     请求进行中按钮是 disabled，此时再按 Enter 不应重复发起。 */
  bindEnterToSend(el("qInput"), doQuery, function(){
    const b = document.querySelector(".query-box button");
    return !(b && b.disabled);
  });
})();

/* 订单台账筛选器：同样放顶层绑定（init() 是 async，异常会让绑定静默丢失） */
(function bindOrderFilter(){
  const btn = el("ordFilterBtn");
  if(!btn) return;
  btn.addEventListener("click", function(e){
    e.stopPropagation();
    if(FLT_MENU && !FLT_MENU.hidden) closeFilterMenu(); else openFilterMenu();
  });
  /* 点菜单外关闭 */
  document.addEventListener("click", function(e){
    if(!FLT_MENU || FLT_MENU.hidden) return;
    /* 兜底：同一次点击的委托处理器可能已经重建了 DOM（删 tag 时重写 #fltCustTags），
       此时 e.target 已脱离文档，contains() 会误判成「点在菜单外」 */
    if(e.target && e.target.isConnected === false) return;
    if(e.target.closest && e.target.closest("#ordFilterBtn")) return;
    if(FLT_MENU.contains(e.target)) return;
    if(FLT_SUB && !FLT_SUB.hidden && FLT_SUB.contains(e.target)) return;
    closeFilterMenu();
  });
  /* Esc 三级：清关键字 → 收子菜单 → 关菜单。
     菜单没开时什么都不做，否则在查询框按 Esc 会静默清掉一个看不见的关键字 */
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(!FLT_MENU || FLT_MENU.hidden) return;
    if(ORDER_FILTER.custKeyword){
      ORDER_FILTER.custKeyword = "";
      FLT_CUST_HI = -1;
      const s = el("fltCustSearch"); if(s) s.value = "";
      renderCustCand();
      focusCustInput();
      e.preventDefault();
      return;
    }
    if(FLT_SUB && !FLT_SUB.hidden){ closeFilterSub(); e.preventDefault(); return; }
    closeFilterMenu();
  });
  window.addEventListener("resize", closeFilterMenu);
  /* 面板内部滚动时按钮会移动：跟随重定位。
     但菜单/子菜单**自身**滚动要跳过 —— placeFilterMenu 会切 visibility 再读
     offsetWidth/offsetHeight（强制同步布局），滚动候选区时每帧一次纯属浪费 */
  window.addEventListener("scroll", function(e){
    if(!FLT_MENU || FLT_MENU.hidden) return;
    if(e.target && e.target !== window && FLT_MENU.contains(e.target)) return;
    if(FLT_SUB && e.target && e.target !== window &&
       (e.target === FLT_SUB || FLT_SUB.contains(e.target))) return;
    placeFilterMenu();
  }, true);
})();

init();
</script>
